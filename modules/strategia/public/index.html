<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Strategia — Sképtou</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/viewer.css" />
</head>
<body>

<div class="sk-shell">

  <header class="sk-header">
    <span class="sk-header__wordmark">Sképtou</span>
    <span class="sk-header__title">Strategia</span>
    <span class="sk-header__spacer"></span>
  </header>

  <div class="sk-filters" role="search" aria-label="Filter documents">
    <label for="filter-team">Team</label>
    <select id="filter-team">
      <option value="">All teams</option>
      <option value="coc">CoC</option>
      <option value="energeia">Energeia</option>
      <option value="phronesis">Phronesis</option>
      <option value="test">Test</option>
    </select>

    <label for="filter-type">Type</label>
    <select id="filter-type">
      <option value="">All types</option>
      <option value="brief">Brief</option>
      <option value="annotated_pdf">Annotated PDF</option>
      <option value="worksheet">Worksheet</option>
      <option value="report">Report</option>
      <option value="image">Image</option>
      <option value="other">Other</option>
    </select>

    <label for="filter-since">Since</label>
    <input type="date" id="filter-since" />

    <label for="filter-until">Until</label>
    <input type="date" id="filter-until" />
  </div>

  <div id="status" class="sk-status" role="status" aria-live="polite">Loading&hellip;</div>

  <div class="sk-table-wrap" id="table-wrap" hidden>
    <table class="sk-table" aria-label="Documents">
      <thead>
        <tr>
          <th>Title</th>
          <th>Team</th>
          <th>Type</th>
          <th>Tags</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <div class="sk-pagination" id="pagination" hidden>
    <button class="sk-pagination__btn" id="btn-prev" disabled>&#8592; Prev</button>
    <span id="pagination-info"></span>
    <button class="sk-pagination__btn" id="btn-next" disabled>Next &#8594;</button>
  </div>

</div>

<script>
const LIMIT = 50;
let offset = 0;
let totalDocs = 0;

const status    = document.getElementById('status');
const tableWrap = document.getElementById('table-wrap');
const tableBody = document.getElementById('table-body');
const pagination = document.getElementById('pagination');
const paginationInfo = document.getElementById('pagination-info');
const btnPrev   = document.getElementById('btn-prev');
const btnNext   = document.getElementById('btn-next');

const filterTeam  = document.getElementById('filter-team');
const filterType  = document.getElementById('filter-type');
const filterSince = document.getElementById('filter-since');
const filterUntil = document.getElementById('filter-until');

function buildUrl() {
  const params = new URLSearchParams();
  params.set('limit',  LIMIT);
  params.set('offset', offset);
  if (filterTeam.value)  params.set('team',         filterTeam.value);
  if (filterType.value)  params.set('content_type', filterType.value);
  if (filterSince.value) params.set('since',         filterSince.value + 'T00:00:00Z');
  if (filterUntil.value) params.set('until',         filterUntil.value + 'T23:59:59Z');
  return '/api/documents?' + params.toString();
}

async function load() {
  status.textContent = 'Loading…';
  status.className   = 'sk-status';
  tableWrap.hidden   = true;
  pagination.hidden  = true;

  let json;
  try {
    const res = await fetch(buildUrl());
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    json = await res.json();
  } catch (err) {
    status.textContent = 'Error loading documents: ' + err.message;
    status.className   = 'sk-status sk-status--error';
    return;
  }

  const { data, meta } = json;
  totalDocs = meta.total;

  if (data.length === 0 && offset === 0) {
    status.textContent = 'No documents found.';
    status.hidden      = false;
    return;
  }

  status.hidden = true;
  tableWrap.hidden = false;

  tableBody.innerHTML = '';
  for (const doc of data) {
    const date = doc.created_at ? doc.created_at.slice(0, 10) : '';
    const tags = Array.isArray(doc.tags)
      ? doc.tags.map(t => `<span class="sk-table__tag">${esc(t)}</span>`).join('')
      : '';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><a class="sk-table__link" href="/view.html?slug=${esc(doc.slug)}">${esc(doc.title)}</a></td>
      <td>${esc(doc.source_team)}</td>
      <td>${esc(doc.content_type)}</td>
      <td>${tags}</td>
      <td class="sk-table__date">${esc(date)}</td>`;
    tableBody.appendChild(tr);
  }

  const from = offset + 1;
  const to   = offset + data.length;
  paginationInfo.textContent = `${from}–${to} of ${totalDocs}`;
  btnPrev.disabled = offset === 0;
  btnNext.disabled = offset + data.length >= totalDocs;
  pagination.hidden = totalDocs <= LIMIT;
}

function esc(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

btnPrev.addEventListener('click', () => { offset = Math.max(0, offset - LIMIT); load(); });
btnNext.addEventListener('click', () => { offset += LIMIT; load(); });

filterTeam.addEventListener('change',  () => { offset = 0; load(); });
filterType.addEventListener('change',  () => { offset = 0; load(); });
filterSince.addEventListener('change', () => { offset = 0; load(); });
filterUntil.addEventListener('change', () => { offset = 0; load(); });

load();
</script>

</body>
</html>
