# phronesis event-types config
#
# Categorization source order (applied by aggregate-busy.js → categorize()):
#   1. iCal CATEGORIES field — case-insensitive match against type name or label
#   2. Title prefix: [Teaching], [Research], [Fitness], [Admin], [Personal], [Travel], [Deadlines]
#   3. Keyword inference (keywords list below, case-insensitive substring match)
#   4. Untyped fallback
#
# colors reference design tokens (skeptou.css):
#   teaching  → steel      #4682b4
#   research  → wine       #722f37
#   fitness   → mauve      #915f6d
#   admin     → quartz     #51414f
#   personal  → lightSteel #b0c4de
#   travel    → coral      #f08080
#   deadlines → purple     #301934
#   untyped   → neutral    #999999

types:
  teaching:
    label: Teaching
    color: "#4682b4"
    prefix: "[Teaching]"
    keywords:
      - teach
      - teaching
      - lecture
      - seminar
      - class
      - course
      - office hours
      - student
      - grade
