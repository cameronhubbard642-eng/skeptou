<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phero &mdash; Shares</title>
  <style>
    /* ── Design tokens ── */
    :root {
      --parchment: #fcf5e5;
      --purple:    #301934;
      --mauve:     #915f6d;
      --wine:      #722f37;
      --quartz:    #51414f;
      --coral:     #f08080;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Borges-Gris', Georgia, 'Times New Roman', serif;
      font-weight: 300;
      background: var(--parchment);
      color: var(--purple);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Layout ── */
    .page { max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem; }

    /* ── Page header ── */
    .page-header { margin-bottom: 2.5rem; }
    .page-header h1 {
      font-size: 1.35rem;
      font-weight: 400;
      font-variant: small-caps;
      letter-spacing: 0.04em;
      color: var(--mauve);
    }
    .page-header .subtitle { font-size: 0.85rem; color: var(--quartz); margin-top: 0.25rem; }
    .rule { border: none; border-top: 0.6pt solid var(--mauve); margin: 1.5rem 0; }

    /* ── Section headers ── */
    .section-title {
      font-size: 0.8rem;
      font-variant: small-caps;
      letter-spacing: 0.06em;
      color: var(--mauve);
      margin-bottom: 1rem;
    }

    /* ── Create form ── */
    #create-section { margin-bottom: 3rem; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.875rem 1.25rem;
    }
    @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
    .form-field { display: flex; flex-direction: column; gap: 0.3rem; }
    .form-field.full-width { grid-column: 1 / -1; }
    label { font-size: 0.78rem; color: var(--quartz); letter-spacing: 0.02em; }
    input[type="text"], input[type="email"], input[type="datetime-local"], select {
      font-family: inherit;
      font-size: 0.875rem;
      color: var(--purple);
      background: #fff;
      border: 1px solid #cbb8be;
      border-radius: 2px;
      padding: 0.45rem 0.6rem;
      width: 100%;
    }
    input:focus, select:focus { outline: 1.5px solid var(--mauve); border-color: var(--mauve); }
    .checkbox-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; }
    .checkbox-row input[type="checkbox"] { accent-color: var(--mauve); }
    .form-actions { margin-top: 1.25rem; display: flex; align-items: center; gap: 1rem; }
    .btn-primary {
      font-family: inherit;
      font-size: 0.85rem;
      background: var(--purple);
      color: var(--parchment);
      border: none;
      border-radius: 2px;
      padding: 0.5rem 1.25rem;
      cursor: pointer;
      letter-spacing: 0.02em;
    }
    .btn-primary:hover { background: var(--mauve); }
    .btn-primary:disabled { opacity: 0.5; cursor: default; }
    .form-msg { font-size: 0.8rem; color: var(--wine); }
    .form-msg.ok { color: #2a6032; }

    /* ── Share list ── */
    #list-section { }
    .list-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .list-controls select { width: auto; padding: 0.35rem 0.5rem; }
    .list-controls .refresh-btn {
      font-family: inherit;
      font-size: 0.8rem;
      background: none;
      border: 1px solid #cbb8be;
      border-radius: 2px;
      padding: 0.35rem 0.75rem;
      color: var(--quartz);
      cursor: pointer;
    }
    .list-controls .refresh-btn:hover { border-color: var(--mauve); color: var(--mauve); }

    /* Table */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }
    thead th {
      text-align: left;
      font-weight: 400;
      font-variant: small-caps;
      letter-spacing: 0.04em;
      color: var(--mauve);
      border-bottom: 0.6pt solid var(--mauve);
      padding: 0.4rem 0.6rem;
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid #e8dde2; }
    tbody tr:hover { background: rgba(145,95,109,0.05); }
    td { padding: 0.55rem 0.6rem; vertical-align: top; }
    .td-label { max-width: 18rem; }
    .td-label .label-text { font-size: 0.875rem; color: var(--purple); }
    .td-label .slug-text {
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      color: var(--quartz);
      margin-top: 0.15rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .copy-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--mauve);
      font-size: 0.7rem;
      padding: 0;
      font-family: inherit;
    }
    .copy-btn:hover { color: var(--wine); }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-variant: small-caps;
      letter-spacing: 0.04em;
      padding: 0.1rem 0.45rem;
      border-radius: 2px;
      white-space: nowrap;
    }
    .badge-energeia { background: #e8f0e8; color: #2a5030; }
    .badge-aristeia { background: #e8e8f0; color: #303060; }
    .badge-active   { background: #e8f0e8; color: #2a5030; }
    .badge-expired  { background: #f0ece8; color: #705040; }
    .badge-revoked  { background: #f0e8e8; color: var(--wine); }
    .td-actions { white-space: nowrap; }
    .action-btn {
      background: none;
      border: 1px solid #cbb8be;
      border-radius: 2px;
      font-family: inherit;
      font-size: 0.75rem;
      color: var(--quartz);
      padding: 0.25rem 0.5rem;
      cursor: pointer;
      margin-right: 0.35rem;
    }
    .action-btn:hover { border-color: var(--mauve); color: var(--mauve); }
    .action-btn.danger:hover { border-color: var(--wine); color: var(--wine); }
    .empty-state { text-align: center; padding: 3rem; color: var(--quartz); font-size: 0.875rem; }

    /* ── View history panel ── */
    #history-panel {
      display: none;
      position: fixed;
      top: 0; right: 0;
      width: min(520px, 100vw);
      height: 100vh;
      background: var(--parchment);
      border-left: 1px solid #cbb8be;
      box-shadow: -4px 0 16px rgba(48,25,52,0.08);
      z-index: 100;
      display: none;
      flex-direction: column;
    }
    #history-panel.open { display: flex; }
    .panel-header {
      padding: 1.25rem 1.5rem 1rem;
      border-bottom: 0.6pt solid var(--mauve);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-title { font-variant: small-caps; letter-spacing: 0.04em; color: var(--mauve); font-size: 0.85rem; }
    .panel-close {
      background: none;
      border: none;
      color: var(--quartz);
      font-size: 1.1rem;
      cursor: pointer;
      line-height: 1;
    }
    .panel-close:hover { color: var(--wine); }
    .panel-body { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; }
    .history-slug { font-family: 'Courier New', monospace; font-size: 0.8rem; color: var(--quartz); margin-bottom: 1rem; }
    .history-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .history-table th {
      text-align: left;
      font-weight: 400;
      font-variant: small-caps;
      color: var(--mauve);
      border-bottom: 0.6pt solid var(--mauve);
      padding: 0.3rem 0.5rem;
    }
    .history-table td { padding: 0.4rem 0.5rem; border-bottom: 1px solid #e8dde2; vertical-align: top; }
    .history-table tr:hover td { background: rgba(145,95,109,0.04); }
    .badge-view     { background: #e8f0e8; color: #2a5030; }
    .badge-download { background: #e8e8f0; color: #303060; }
    .panel-pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1.5rem;
      border-top: 1px solid #e8dde2;
      font-size: 0.8rem;
      color: var(--quartz);
    }
    .panel-pagination button {
      font-family: inherit;
      font-size: 0.78rem;
      background: none;
      border: 1px solid #cbb8be;
      border-radius: 2px;
      padding: 0.25rem 0.6rem;
      color: var(--quartz);
      cursor: pointer;
    }
    .panel-pagination button:disabled { opacity: 0.4; cursor: default; }
    .panel-pagination button:not(:disabled):hover { border-color: var(--mauve); color: var(--mauve); }
  </style>
</head>
<body>
<div class="page">

  <!-- Page header -->
  <div class="page-header">
    <h1>Phero &mdash; Document Shares</h1>
    <p class="subtitle">phero.skeptou.com</p>
  </div>
  <hr class="rule">

  <!-- Create share form -->
  <section id="create-section">
    <p class="section-title">&sect; Create Share</p>
    <form id="create-form">
      <div class="form-grid">
        <div class="form-field">
          <label for="f-source-module">Source module</label>
          <select id="f-source-module" required>
            <option value="energeia">Energeia</option>
            <option value="aristeia">Aristeia</option>
          </select>
        </div>
        <div class="form-field">
          <label for="f-source-slug">Source slug</label>
          <input type="text" id="f-source-slug" placeholder="e.g. hubbard-2024-grounding" required>
        </div>
        <div class="form-field">
          <label for="f-label">Label <span style="color:var(--quartz)">(optional)</span></label>
          <input type="text" id="f-label" placeholder="e.g. Search committee &mdash; Smith College">
        </div>
        <div class="form-field">
          <label for="f-slug">Custom slug <span style="color:var(--quartz)">(optional)</span></label>
          <input type="text" id="f-slug" placeholder="e.g. my-paper-2026 (leave blank to auto-generate)">
        </div>
        <div class="form-field">
          <label for="f-recipient-email">Recipient email <span style="color:var(--quartz)">(optional annotation)</span></label>
          <input type="email" id="f-recipient-email" placeholder="reviewer@university.edu">
        </div>
        <div class="form-field">
          <label for="f-expires-at">Expires</label>
          <input type="datetime-local" id="f-expires-at">
        </div>
        <div class="form-field full-width">
          <label class="checkbox-row">
            <input type="checkbox" id="f-snapshot-mode">
            Pin to current version (snapshot mode)
          </label>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary" id="create-btn">Create share</button>
        <span class="form-msg" id="create-msg"></span>
      </div>
    </form>
  </section>

  <hr class="rule">

  <!-- Share list -->
  <section id="list-section">
    <p class="section-title">&sect; Shares</p>
    <div class="list-controls">
      <select id="filter-module">
        <option value="">All modules</option>
        <option value="energeia">Energeia</option>
        <option value="aristeia">Aristeia</option>
      </select>
      <button class="refresh-btn" id="refresh-btn">Refresh</button>
    </div>
    <div class="table-wrap">
      <table id="shares-table">
        <thead>
          <tr>
            <th>Label / Slug</th>
            <th>Source</th>
            <th>Views</th>
            <th>Last viewed</th>
            <th>Expires</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="shares-tbody">
          <tr><td colspan="7" class="empty-state">Loading&hellip;</td></tr>
        </tbody>
      </table>
    </div>
    <div id="list-pagination" style="display:none; margin-top:1rem; font-size:0.8rem; color:var(--quartz); display:flex; gap:1rem; align-items:center; flex-wrap:wrap;">
      <button class="action-btn" id="prev-page">&#8592; Prev</button>
      <span id="page-info"></span>
      <button class="action-btn" id="next-page">Next &#8594;</button>
    </div>
  </section>

</div>

<!-- View history side panel -->
<div id="history-panel">
  <div class="panel-header">
    <span class="panel-title">View History</span>
    <button class="panel-close" id="panel-close">&times;</button>
  </div>
  <div class="panel-body">
    <div class="history-slug" id="history-slug"></div>
    <div id="history-content"><p style="color:var(--quartz);font-size:0.85rem">Loading&hellip;</p></div>
  </div>
  <div class="panel-pagination">
    <button id="history-prev" disabled>&#8592; Prev</button>
    <span id="history-page-info"></span>
    <button id="history-next" disabled>Next &#8594;</button>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let currentOffset = 0;
  const PAGE_SIZE = 50;
  let totalShares = 0;
  let historySlug = null;
  let historyOffset = 0;
  const HISTORY_PAGE = 25;
  let historyTotal = 0;

  // ── Utilities ──────────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function relativeTime(iso) {
    if (!iso) return '';
    const delta = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (delta < 60) return 'just now';
    if (delta < 3600) return `${Math.floor(delta/60)}m ago`;
    if (delta < 86400) return `${Math.floor(delta/3600)}h ago`;
    return `${Math.floor(delta/86400)}d ago`;
  }

  function formatDate(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
  }

  function shareStatus(row) {
    if (row.revoked_at) return '<span class="badge badge-revoked">Revoked</span>';
    if (row.expires_at && row.expires_at <= new Date().toISOString()) return '<span class="badge badge-expired">Expired</span>';
    return '<span class="badge badge-active">Active</span>';
  }

  function copyToClipboard(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      const orig = btn.textContent;
      btn.textContent = 'copied';
      setTimeout(() => { btn.textContent = orig; }, 1500);
    });
  }

  // ── Default expiry: 45 days from now ──────────────────────────────────────
  (function setDefaultExpiry() {
    const d = new Date(Date.now() + 45 * 86400 * 1000);
    d.setSeconds(0, 0);
    document.getElementById('f-expires-at').value = d.toISOString().slice(0,16);
  })();

  // ── Load shares ────────────────────────────────────────────────────────────
  async function loadShares(offset = 0) {
    currentOffset = offset;
    const module = document.getElementById('filter-module').value;
    let url = `/api/shares?limit=${PAGE_SIZE}&offset=${offset}`;
    if (module) url += `&source_module=${module}`;

    const tbody = document.getElementById('shares-tbody');
    tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Loading&hellip;</td></tr>';

    let data;
    try {
      const res = await fetch(url, { credentials: 'same-origin' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      data = await res.json();
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="7" class="empty-state" style="color:var(--wine)">Failed to load shares: ${escHtml(e.message)}</td></tr>`;
      return;
    }

    const rows = data.rows ?? [];
    totalShares = data.total ?? rows.length;

    if (rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No shares yet.</td></tr>';
      document.getElementById('list-pagination').style.display = 'none';
      return;
    }

    tbody.innerHTML = rows.map(row => {
      const label = row.label || row.source_slug;
      const shareUrl = `https://phero.skeptou.com/${row.slug}`;
      const isActive = !row.revoked_at && (!row.expires_at || row.expires_at > new Date().toISOString());
      return `<tr data-slug="${escHtml(row.slug)}">
        <td class="td-label">
          <div class="label-text">${escHtml(label)}</div>
          <div class="slug-text">
            ${escHtml(row.slug)}
            <button class="copy-btn" data-copy="${escHtml(shareUrl)}" title="Copy link">copy</button>
          </div>
        </td>
        <td><span class="badge badge-${escHtml(row.source_module)}">${escHtml(row.source_module)}</span></td>
        <td>${row.view_count ?? 0}</td>
        <td>${relativeTime(row.last_viewed_at)}</td>
        <td>${row.expires_at ? formatDate(row.expires_at) : 'No expiry'}</td>
        <td>${shareStatus(row)}</td>
        <td class="td-actions">
          <button class="action-btn view-history-btn" data-slug="${escHtml(row.slug)}">History</button>
          ${isActive ? `<button class="action-btn danger revoke-btn" data-slug="${escHtml(row.slug)}">Revoke</button>` : ''}
        </td>
      </tr>`;
    }).join('');

    // Pagination
    const pag = document.getElementById('list-pagination');
    const hasMore = rows.length === PAGE_SIZE;
    const hasPrev = offset > 0;
    if (hasMore || hasPrev) {
      pag.style.display = 'flex';
      document.getElementById('prev-page').disabled = !hasPrev;
      document.getElementById('next-page').disabled = !hasMore;
      document.getElementById('page-info').textContent =
        `Showing ${offset + 1}${hasMore ? '–' + (offset + rows.length) : '–' + (offset + rows.length)}`;
    } else {
      pag.style.display = 'none';
    }

    // Bind copy buttons
    tbody.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', () => copyToClipboard(btn.dataset.copy, btn));
    });

    // Bind history buttons
    tbody.querySelectorAll('.view-history-btn').forEach(btn => {
      btn.addEventListener('click', () => openHistory(btn.dataset.slug));
    });

    // Bind revoke buttons
    tbody.querySelectorAll('.revoke-btn').forEach(btn => {
      btn.addEventListener('click', () => revokeShare(btn.dataset.slug, btn));
    });
  }

  // ── Revoke ─────────────────────────────────────────────────────────────────
  async function revokeShare(slug, btn) {
    if (!confirm(`Revoke share "${slug}"? This cannot be undone.`)) return;
    btn.disabled = true;
    try {
      const res = await fetch(`/api/shares/${slug}`, { method: 'DELETE', credentials: 'same-origin' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      await loadShares(currentOffset);
    } catch (e) {
      alert(`Revoke failed: ${e.message}`);
      btn.disabled = false;
    }
  }

  // ── View history panel ─────────────────────────────────────────────────────
  async function openHistory(slug, offset = 0) {
    historySlug = slug;
    historyOffset = offset;
    const panel = document.getElementById('history-panel');
    panel.classList.add('open');
    document.getElementById('history-slug').textContent = slug;
    document.getElementById('history-content').innerHTML = '<p style="color:var(--quartz);font-size:0.85rem">Loading&hellip;</p>';

    let data;
    try {
      const res = await fetch(`/api/shares/${slug}/views?limit=${HISTORY_PAGE}&offset=${offset}`, { credentials: 'same-origin' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      data = await res.json();
    } catch (e) {
      document.getElementById('history-content').innerHTML = `<p style="color:var(--wine);font-size:0.85rem">Failed: ${escHtml(e.message)}</p>`;
      return;
    }

    historyTotal = data.total ?? 0;
    const rows = data.rows ?? [];

    if (rows.length === 0) {
      document.getElementById('history-content').innerHTML = '<p style="color:var(--quartz);font-size:0.85rem">No views recorded yet.</p>';
      updateHistoryPagination(0, 0, 0);
      return;
    }

    document.getElementById('history-content').innerHTML = `
      <table class="history-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>Type</th>
            <th>Country</th>
            <th>Referrer</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r => `<tr>
            <td>${escHtml(relativeTime(r.occurred_at))}<br><span style="font-size:0.72rem;color:var(--quartz)">${escHtml(r.occurred_at?.slice(0,16).replace('T',' ') ?? '')}</span></td>
            <td><span class="badge badge-${escHtml(r.event_type)}">${escHtml(r.event_type)}</span></td>
            <td>${escHtml(r.cf_country ?? '')}</td>
            <td style="max-width:12rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escHtml(r.referrer ?? '')}">${escHtml(r.referrer || '')}</td>
          </tr>`).join('')}
        </tbody>
      </table>`;

    updateHistoryPagination(historyTotal, offset, rows.length);
  }

  function updateHistoryPagination(total, offset, count) {
    const hasPrev = offset > 0;
    const hasNext = offset + count < total;
    document.getElementById('history-prev').disabled = !hasPrev;
    document.getElementById('history-next').disabled = !hasNext;
    document.getElementById('history-page-info').textContent =
      total > 0 ? `${offset + 1}–${offset + count} of ${total}` : '0 views';
  }

  document.getElementById('history-prev').addEventListener('click', () => {
    if (historySlug && historyOffset > 0) openHistory(historySlug, historyOffset - HISTORY_PAGE);
  });
  document.getElementById('history-next').addEventListener('click', () => {
    if (historySlug) openHistory(historySlug, historyOffset + HISTORY_PAGE);
  });
  document.getElementById('panel-close').addEventListener('click', () => {
    document.getElementById('history-panel').classList.remove('open');
    historySlug = null;
  });

  // ── Create form ────────────────────────────────────────────────────────────
  document.getElementById('create-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('create-btn');
    const msg = document.getElementById('create-msg');
    btn.disabled = true;
    msg.textContent = '';
    msg.className = 'form-msg';

    const expiresVal = document.getElementById('f-expires-at').value;
    const body = {
      source_module: document.getElementById('f-source-module').value,
      source_slug: document.getElementById('f-source-slug').value.trim(),
      label: document.getElementById('f-label').value.trim() || undefined,
      slug: document.getElementById('f-slug').value.trim() || undefined,
      recipient_email: document.getElementById('f-recipient-email').value.trim() || undefined,
      expires_at: expiresVal ? new Date(expiresVal).toISOString() : undefined,
      snapshot_mode: document.getElementById('f-snapshot-mode').checked || undefined,
    };

    try {
      const res = await fetch('/api/shares', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error ?? `HTTP ${res.status}`);

      const url = `https://phero.skeptou.com/${data.slug}`;
      msg.className = 'form-msg ok';
      msg.innerHTML = `Created: <a href="${escHtml(url)}" target="_blank" style="color:var(--mauve)">${escHtml(url)}</a>`;

      // Reset form (keep module selection)
      document.getElementById('f-source-slug').value = '';
      document.getElementById('f-label').value = '';
      document.getElementById('f-slug').value = '';
      document.getElementById('f-recipient-email').value = '';
      document.getElementById('f-snapshot-mode').checked = false;
      const d = new Date(Date.now() + 45 * 86400 * 1000);
      d.setSeconds(0, 0);
      document.getElementById('f-expires-at').value = d.toISOString().slice(0,16);

      await loadShares(0);
    } catch (err) {
      msg.textContent = `Error: ${err.message}`;
    } finally {
      btn.disabled = false;
    }
  });

  // ── Filters + pagination ───────────────────────────────────────────────────
  document.getElementById('filter-module').addEventListener('change', () => loadShares(0));
  document.getElementById('refresh-btn').addEventListener('click', () => loadShares(currentOffset));
  document.getElementById('prev-page').addEventListener('click', () => {
    if (currentOffset > 0) loadShares(Math.max(0, currentOffset - PAGE_SIZE));
  });
  document.getElementById('next-page').addEventListener('click', () => loadShares(currentOffset + PAGE_SIZE));

  // ── Init ───────────────────────────────────────────────────────────────────
  loadShares(0);
</script>
</body>
</html>
