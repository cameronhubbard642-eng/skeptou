name = "phero-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Static assets (management UI, root redirect).
# Served by Cloudflare CDN before the Worker is invoked.
# Worker handles all routes that do not match a static file.
[assets]
directory = "public"

# HTML templates in templates/ are bundled into the Worker bundle as text
# strings at build time (not served as static assets).
[[rules]]
type = "Text"
globs = ["templates/**/*.html"]

[[d1_databases]]
binding = "PHERO_DB"
database_name = "skeptou-phero"
database_id = "FILL_AFTER_CREATE"

[[routes]]
pattern = "phero.skeptou.com/*"
custom_domain = true

[vars]
ENERGEIA_BASE_URL     = "https://energeia.skeptou.com"
ARISTEIA_BASE_URL     = "https://aristeia.skeptou.com"
SHARE_COOKIE_TTL_DAYS = "7"
ADMIN_EMAIL           = "camh502@alumni.stanford.edu"

# Secrets (provisioned by CI from GH secrets; set once via repo Settings -> Secrets):
# ENERGEIA_SERVICE_TOKEN        GH secret: PHERO_ENERGEIA_SERVICE_TOKEN
# ARISTEIA_SERVICE_TOKEN        GH secret: PHERO_ARISTEIA_SERVICE_TOKEN
# COOKIE_SIGNING_KEY            GH secret: PHERO_COOKIE_SIGNING_KEY
# AUTH_HMAC_SECRET              GH secret: PHERO_AUTH_HMAC_SECRET (= auth-core HMAC_SECRET)
