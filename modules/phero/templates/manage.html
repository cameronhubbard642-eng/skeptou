<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phero — Share Management</title>
  <style>
    @font-face { font-family: 'Borges'; src: url('/fonts/Borges-Gris.ttf') format('truetype'); font-weight: 300; font-style: normal; }
    @font-face { font-family: 'Borges'; src: url('/fonts/Borges-GrisItalic.ttf') format('truetype'); font-weight: 300; font-style: italic; }
    @font-face { font-family: 'Borges'; src: url('/fonts/Borges-Negra.ttf') format('truetype'); font-weight: 700; font-style: normal; }

    :root {
      --parchment: #fcf5e5;
      --purple:    #301934;
      --mauve:     #915f6d;
      --wine:      #722f37;
      --quartz:    #51414f;
      --rule:      rgba(145,95,109,.35);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Borges', Georgia, serif;
      font-weight: 300;
      background: var(--parchment);
      color: var(--purple);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ── Layout ─────────────────────────────────────────────────── */
    header {
      border-bottom: 1px solid var(--rule);
      padding: 24px 32px 18px;
    }
    header h1 {
      font-size: 0.85rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mauve);
    }
    header p {
      font-size: 0.78rem;
      color: var(--quartz);
      margin-top: 2px;
    }

    main { padding: 28px 32px; max-width: 1100px; }

    /* ── Section headers ────────────────────────────────────────── */
    .section-head {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 16px;
    }
    .section-head h2 {
      font-size: 0.78rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mauve);
    }
    .section-rule {
      flex: 1;
      border: none;
      border-top: 0.6px solid var(--rule);
    }

    /* ── Buttons ────────────────────────────────────────────────── */
    .btn {
      display: inline-block;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      padding: 5px 12px;
      border-radius: 2px;
      cursor: pointer;
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--purple);
      transition: background 0.15s, color 0.15s;
    }
    .btn:hover { background: rgba(48,25,52,.06); }
    .btn-primary { background: var(--mauve); color: #fff; border-color: var(--mauve); }
    .btn-primary:hover { background: #7a4f5c; }
    .btn-danger { color: var(--wine); border-color: rgba(114,47,55,.35); }
    .btn-danger:hover { background: rgba(114,47,55,.08); }
    .btn-sm { font-size: 0.7rem; padding: 3px 8px; }
    .btn[disabled] { opacity: 0.4; cursor: not-allowed; }

    /* ── Create form ────────────────────────────────────────────── */
    #create-section { margin-bottom: 36px; }
    #create-toggle-btn { margin-bottom: 0; }

    #create-form {
      display: none;
      background: rgba(145,95,109,.04);
      border: 1px solid var(--rule);
      border-radius: 3px;
      padding: 20px 24px;
      margin-top: 12px;
    }
    #create-form.open { display: block; }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 14px;
    }
    .field-row.single { grid-template-columns: 1fr; }
    .field-row.triple { grid-template-columns: 1fr 1fr 1fr; }

    label {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mauve);
      margin-bottom: 5px;
    }
    label span { font-size: 0.65rem; text-transform: none; color: var(--quartz); letter-spacing: 0; }

    input[type=text], input[type=email], input[type=datetime-local], select {
      width: 100%;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 300;
      background: var(--parchment);
      color: var(--purple);
      border: 1px solid var(--rule);
      border-radius: 2px;
      padding: 6px 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus { border-color: var(--mauve); }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      font-size: 0.82rem;
      color: var(--quartz);
    }
    .checkbox-row input[type=checkbox] { width: 14px; height: 14px; accent-color: var(--mauve); }

    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    #create-error {
      font-size: 0.78rem;
      color: var(--wine);
      margin-top: 8px;
      display: none;
    }

    /* ── Share list ─────────────────────────────────────────────── */
    #list-section { }

    #shares-table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    thead th {
      text-align: left;
      font-weight: 300;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      font-size: 0.68rem;
      color: var(--mauve);
      padding: 6px 10px 8px;
      border-bottom: 1px solid var(--rule);
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid rgba(145,95,109,.12); }
    tbody tr:last-child { border-bottom: none; }
    tbody td {
      padding: 10px 10px;
      vertical-align: top;
      color: var(--purple);
    }
    tbody tr:hover { background: rgba(145,95,109,.04); }

    .slug-cell {
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      color: var(--quartz);
    }
    .badge {
      display: inline-block;
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 2px;
      font-weight: 300;
    }
    .badge-energeia { background: rgba(70,130,180,.12); color: #4682b4; }
    .badge-aristeia { background: rgba(114,47,55,.1); color: var(--wine); }
    .badge-active   { background: rgba(80,150,80,.1); color: #3a7a3a; }
    .badge-expired  { background: rgba(145,95,109,.12); color: var(--quartz); }
    .badge-revoked  { background: rgba(114,47,55,.1); color: var(--wine); }

    .actions-cell {
      white-space: nowrap;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: flex-start;
    }

    /* ── View history panel ─────────────────────────────────────── */
    .history-row { display: none; }
    .history-row.open { display: table-row; }
    .history-panel {
      padding: 12px 16px 16px;
      background: rgba(145,95,109,.03);
      border-top: 1px solid var(--rule);
    }
    .history-panel h3 {
      font-size: 0.72rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--mauve);
      margin-bottom: 10px;
      font-weight: 300;
    }
    .history-table {
      font-size: 0.75rem;
    }
    .history-table thead th { font-size: 0.63rem; }
    .history-table tbody td { padding: 6px 10px; }
    .ua-cell {
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--quartz);
      font-size: 0.7rem;
    }
    .history-pagination {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      align-items: center;
      font-size: 0.75rem;
      color: var(--quartz);
    }

    /* ── Empty / loading states ─────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 40px 0;
      color: var(--quartz);
      font-size: 0.85rem;
      font-style: italic;
    }
    .loading { color: var(--quartz); font-style: italic; font-size: 0.82rem; }

    /* ── Toast ──────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: var(--purple);
      color: var(--parchment);
      font-size: 0.8rem;
      padding: 10px 16px;
      border-radius: 3px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 200;
    }
    #toast.show { opacity: 1; }

    @media (max-width: 640px) {
      header { padding: 16px; }
      main { padding: 16px; }
      .field-row { grid-template-columns: 1fr; }
      .field-row.triple { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Phero — Share Management</h1>
    <p>Create and manage outward-facing document share links.</p>
  </header>

  <main>
    <!-- Create share section -->
    <section id="create-section">
      <div class="section-head">
        <h2>Shares</h2>
        <hr class="section-rule">
        <button class="btn btn-primary btn-sm" id="create-toggle-btn" onclick="toggleCreateForm()">+ New Share</button>
      </div>

      <div id="create-form">
        <form id="new-share-form" onsubmit="submitCreateForm(event)">
          <div class="field-row">
            <div>
              <label for="f-module">Source Module</label>
              <select id="f-module" required>
                <option value="energeia">energeia</option>
                <option value="aristeia">aristeia</option>
              </select>
            </div>
            <div>
              <label for="f-source-slug">Source Document Slug</label>
              <input type="text" id="f-source-slug" placeholder="paper-slug-in-upstream" required>
            </div>
          </div>
          <div class="field-row">
            <div>
              <label for="f-label">Label <span>(optional — Cam-facing only)</span></label>
              <input type="text" id="f-label" placeholder="Search committee — Smith 2026">
            </div>
            <div>
              <label for="f-custom-slug">Custom Slug <span>(optional; blank = auto-generate)</span></label>
              <input type="text" id="f-custom-slug" placeholder="my-paper-2026" pattern="[a-z0-9][a-z0-9\-]{2,62}[a-z0-9]">
            </div>
          </div>
          <div class="field-row">
            <div>
              <label for="f-recipient">Recipient Annotation <span>(optional; not enforced)</span></label>
              <input type="email" id="f-recipient" placeholder="reviewer@university.edu">
            </div>
            <div>
              <label for="f-expires">Expires At <span>(blank = 45-day default)</span></label>
              <input type="datetime-local" id="f-expires">
            </div>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" id="f-snapshot">
            <label for="f-snapshot" style="text-transform:none;font-size:0.82rem;letter-spacing:0;color:var(--purple);margin-bottom:0;">
              Pin to current version (snapshot mode)
            </label>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="create-submit-btn">Create Share</button>
            <button type="button" class="btn" onclick="toggleCreateForm()">Cancel</button>
          </div>
          <p id="create-error"></p>
        </form>
      </div>
    </section>

    <!-- Share list -->
    <section id="list-section">
      <div id="shares-table-wrap">
        <p class="loading" id="list-loading">Loading shares…</p>
        <table id="shares-table" style="display:none">
          <thead>
            <tr>
              <th>Label / Document</th>
              <th>Slug</th>
              <th>Module</th>
              <th>Views</th>
              <th>Last Viewed</th>
              <th>Expires</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="shares-tbody"></tbody>
        </table>
        <p class="empty-state" id="list-empty" style="display:none">No shares yet. Create one above.</p>
      </div>
    </section>
  </main>

  <div id="toast"></div>

  <script>
    // ── State ─────────────────────────────────────────────────────
    let shares = [];
    let openHistorySlug = null;

    // ── Init ──────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', loadShares);

    async function loadShares() {
      document.getElementById('list-loading').style.display = '';
      document.getElementById('shares-table').style.display = 'none';
      document.getElementById('list-empty').style.display = 'none';

      try {
        const res = await fetch('/api/shares');
        if (!res.ok) throw new Error('Failed to load shares');
        const data = await res.json();
        shares = data.shares || [];
        renderShareList();
      } catch (e) {
        document.getElementById('list-loading').textContent = 'Error loading shares.';
      }
    }

    function renderShareList() {
      document.getElementById('list-loading').style.display = 'none';
      const tbody = document.getElementById('shares-tbody');
      tbody.innerHTML = '';

      if (shares.length === 0) {
        document.getElementById('list-empty').style.display = '';
        return;
      }

      document.getElementById('shares-table').style.display = '';

      for (const s of shares) {
        const status = shareStatus(s);
        const tr = document.createElement('tr');
        tr.dataset.slug = s.slug;
        tr.innerHTML = `
          <td>${esc(s.label || s.source_slug)}</td>
          <td class="slug-cell">${esc(s.slug)}</td>
          <td><span class="badge badge-${esc(s.source_module)}">${esc(s.source_module)}</span></td>
          <td>${s.view_count}</td>
          <td>${s.last_viewed_at ? relTime(s.last_viewed_at) : '—'}</td>
          <td>${s.expires_at ? fmtDate(s.expires_at) : 'No expiry'}</td>
          <td><span class="badge badge-${status.toLowerCase()}">${status}</span></td>
          <td class="actions-cell">
            <button class="btn btn-sm" onclick="copyLink('${esc(s.slug)}')">Copy link</button>
            <button class="btn btn-sm" onclick="toggleHistory('${esc(s.slug)}')">View history</button>
            ${status !== 'Revoked'
              ? `<button class="btn btn-sm btn-danger" onclick="revokeShare('${esc(s.slug)}')">Revoke</button>`
              : ''}
          </td>`;
        tbody.appendChild(tr);

        // History row (hidden until toggled)
        const histTr = document.createElement('tr');
        histTr.className = 'history-row';
        histTr.id = `hist-${s.slug}`;
        const histTd = document.createElement('td');
        histTd.colSpan = 8;
        histTd.innerHTML = `<div class="history-panel"><h3>View history — ${esc(s.slug)}</h3><div class="hist-content" id="hist-content-${esc(s.slug)}"><p class="loading">Loading…</p></div></div>`;
        histTr.appendChild(histTd);
        tbody.appendChild(histTr);
      }
    }

    function shareStatus(s) {
      if (s.revoked_at) return 'Revoked';
      if (s.expires_at && s.expires_at < new Date().toISOString()) return 'Expired';
      return 'Active';
    }

    // ── Create form ───────────────────────────────────────────────
    function toggleCreateForm() {
      const form = document.getElementById('create-form');
      form.classList.toggle('open');
    }

    async function submitCreateForm(e) {
      e.preventDefault();
      const errEl = document.getElementById('create-error');
      const btn = document.getElementById('create-submit-btn');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Creating…';

      const customSlug = document.getElementById('f-custom-slug').value.trim();
      const expiresRaw = document.getElementById('f-expires').value;

      const body = {
        source_module: document.getElementById('f-module').value,
        source_slug: document.getElementById('f-source-slug').value.trim(),
        label: document.getElementById('f-label').value.trim() || undefined,
        recipient_email: document.getElementById('f-recipient').value.trim() || undefined,
        snapshot_mode: document.getElementById('f-snapshot').checked || undefined,
      };
      if (customSlug) body.slug = customSlug;
      if (expiresRaw) body.expires_at = new Date(expiresRaw).toISOString();

      try {
        const res = await fetch('/api/shares', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.error || 'Unknown error';
          errEl.style.display = '';
        } else {
          document.getElementById('new-share-form').reset();
          document.getElementById('create-form').classList.remove('open');
          toast(`Share created: ${data.share_url}`);
          await loadShares();
        }
      } catch {
        errEl.textContent = 'Network error. Please try again.';
        errEl.style.display = '';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Share';
      }
    }

    // ── Revoke ────────────────────────────────────────────────────
    async function revokeShare(slug) {
      if (!confirm(`Revoke share "${slug}"? This cannot be undone.`)) return;
      try {
        const res = await fetch(`/api/shares/${encodeURIComponent(slug)}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Failed to revoke');
        toast('Share revoked.');
        await loadShares();
      } catch {
        toast('Error revoking share.');
      }
    }

    // ── Copy link ─────────────────────────────────────────────────
    async function copyLink(slug) {
      const url = `${location.origin}/${slug}`;
      try {
        await navigator.clipboard.writeText(url);
        toast('Link copied.');
      } catch {
        prompt('Copy this link:', url);
      }
    }

    // ── View history ──────────────────────────────────────────────
    async function toggleHistory(slug) {
      const row = document.getElementById(`hist-${slug}`);
      const isOpen = row.classList.contains('open');

      // Close any other open panel
      document.querySelectorAll('.history-row.open').forEach(r => r.classList.remove('open'));

      if (isOpen) {
        openHistorySlug = null;
        return;
      }

      row.classList.add('open');
      openHistorySlug = slug;
      await loadHistory(slug, 0);
    }

    async function loadHistory(slug, offset) {
      const contentEl = document.getElementById(`hist-content-${slug}`);
      if (!contentEl) return;
      contentEl.innerHTML = '<p class="loading">Loading…</p>';

      try {
        const res = await fetch(`/api/shares/${encodeURIComponent(slug)}/views?limit=25&offset=${offset}`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        renderHistory(slug, data, offset);
      } catch {
        contentEl.innerHTML = '<p style="color:var(--wine);font-size:.78rem">Error loading view history.</p>';
      }
    }

    function renderHistory(slug, data, offset) {
      const contentEl = document.getElementById(`hist-content-${slug}`);
      if (!contentEl) return;

      if (!data.rows || data.rows.length === 0) {
        contentEl.innerHTML = '<p class="loading">No views recorded yet.</p>';
        return;
      }

      let html = `<table class="history-table">
        <thead><tr>
          <th>#</th><th>Time</th><th>Event</th><th>Country</th><th>Referrer</th><th>User Agent</th>
        </tr></thead><tbody>`;

      data.rows.forEach((row, i) => {
        html += `<tr>
          <td>${offset + i + 1}</td>
          <td style="white-space:nowrap">${fmtDateTime(row.occurred_at)}</td>
          <td><span class="badge badge-${row.event_type === 'download' ? 'aristeia' : 'active'}">${esc(row.event_type)}</span></td>
          <td>${esc(row.cf_country || '—')}</td>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(row.referrer || '—')}</td>
          <td class="ua-cell" title="${esc(row.user_agent || '')}">${esc((row.user_agent || '—').slice(0, 80))}</td>
        </tr>`;
      });

      html += '</tbody></table>';

      // Pagination
      const total = data.total || 0;
      const hasPrev = offset > 0;
      const hasNext = offset + 25 < total;
      html += `<div class="history-pagination">
        <span>${total} total event${total === 1 ? '' : 's'}</span>
        ${hasPrev ? `<button class="btn btn-sm" onclick="loadHistory('${esc(slug)}', ${offset - 25})">← Prev</button>` : ''}
        ${hasNext ? `<button class="btn btn-sm" onclick="loadHistory('${esc(slug)}', ${offset + 25})">Next →</button>` : ''}
      </div>`;

      contentEl.innerHTML = html;
    }

    // ── Helpers ───────────────────────────────────────────────────
    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#x27;');
    }

    function relTime(iso) {
      const diff = Date.now() - new Date(iso).getTime();
      const m = Math.floor(diff / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return `${m}m ago`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}h ago`;
      const d = Math.floor(h / 24);
      return `${d}d ago`;
    }

    function fmtDate(iso) {
      return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function fmtDateTime(iso) {
      return new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
