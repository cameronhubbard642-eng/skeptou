<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{LABEL}}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #fafafa;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 0.875rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .doc-title {
      font-size: 1rem;
      font-weight: normal;
      color: #222;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 60ch;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }
    .expiry-note {
      font-size: 0.8rem;
      color: #777;
    }
    .download-btn {
      display: inline-block;
      padding: 0.45rem 1rem;
      background: #222;
      color: #fff;
      font-family: inherit;
      font-size: 0.85rem;
      text-decoration: none;
      border-radius: 3px;
      cursor: pointer;
    }
    .download-btn:hover { background: #444; }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
    }
    #viewer-container {
      width: 100%;
      max-width: 900px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    #pdf-canvas-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }
    canvas {
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      max-width: 100%;
    }
    #markdown-body {
      background: #fff;
      padding: 2rem;
      border: 1px solid #e0e0e0;
      border-radius: 2px;
      line-height: 1.7;
      max-width: 72ch;
      margin: 0 auto;
    }
    #markdown-body h1, #markdown-body h2, #markdown-body h3 { margin: 1.5em 0 0.5em; }
    #markdown-body p { margin: 0.75em 0; }
    #markdown-body code { font-family: monospace; font-size: 0.9em; background: #f4f4f4; padding: 0.1em 0.3em; border-radius: 2px; }
    #markdown-body pre { background: #f4f4f4; padding: 1em; overflow-x: auto; border-radius: 2px; }
    #pagination {
      display: flex;
      align-items: center;
      gap: 1rem;
      justify-content: center;
      padding: 0.5rem 0;
      font-size: 0.875rem;
      color: #555;
    }
    #pagination button {
      padding: 0.35rem 0.75rem;
      font-family: inherit;
      font-size: 0.875rem;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 3px;
      cursor: pointer;
    }
    #pagination button:disabled { opacity: 0.4; cursor: default; }
    #loading {
      text-align: center;
      padding: 3rem;
      color: #666;
      font-size: 0.9rem;
    }
    #error-msg {
      text-align: center;
      padding: 3rem;
      color: #c00;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <span class="doc-title" id="doc-title">{{LABEL}}</span>
    <div class="header-right">
      <span class="expiry-note" id="expiry-note">{{EXPIRY_LINE}}</span>
      <a class="download-btn" id="download-link" href="/api/share/{{SLUG}}" download>Download</a>
    </div>
  </header>
  <main>
    <div id="viewer-container">
      <div id="loading">Loading document&hellip;</div>
      <div id="error-msg">The document could not be loaded.</div>
      <div id="pdf-canvas-wrapper" style="display:none"></div>
      <div id="pagination" style="display:none">
        <button id="prev-page">&#8592; Prev</button>
        <span id="page-info"></span>
        <button id="next-page">Next &#8594;</button>
      </div>
      <div id="markdown-body" style="display:none"></div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

    const SLUG = '{{SLUG}}';
    const apiUrl = `/api/share/${SLUG}`;

    const loading = document.getElementById('loading');
    const errorMsg = document.getElementById('error-msg');
    const pdfWrapper = document.getElementById('pdf-canvas-wrapper');
    const pagination = document.getElementById('pagination');
    const markdownBody = document.getElementById('markdown-body');
    const prevBtn = document.getElementById('prev-page');
    const nextBtn = document.getElementById('next-page');
    const pageInfo = document.getElementById('page-info');

    let pdfDoc = null;
    let currentPage = 1;

    async function renderPdfPage(num) {
      const page = await pdfDoc.getPage(num);
      const viewport = page.getViewport({ scale: Math.min(1.5, (pdfWrapper.clientWidth || 800) / page.getViewport({ scale: 1 }).width) });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport }).promise;
      pdfWrapper.innerHTML = '';
      pdfWrapper.appendChild(canvas);
      pdfWrapper.style.display = 'flex';
      pageInfo.textContent = `Page ${num} of ${pdfDoc.numPages}`;
      prevBtn.disabled = num <= 1;
      nextBtn.disabled = num >= pdfDoc.numPages;
      pagination.style.display = pdfDoc.numPages > 1 ? 'flex' : 'none';
    }

    prevBtn.addEventListener('click', () => { if (currentPage > 1) renderPdfPage(--currentPage); });
    nextBtn.addEventListener('click', () => { if (currentPage < pdfDoc.numPages) renderPdfPage(++currentPage); });

    async function loadDocument() {
      try {
        const res = await fetch(apiUrl, { credentials: 'same-origin' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const contentType = res.headers.get('Content-Type') ?? '';

        if (contentType.includes('pdf')) {
          const bytes = await res.arrayBuffer();
          pdfDoc = await pdfjsLib.getDocument({ data: bytes }).promise;
          loading.style.display = 'none';
          await renderPdfPage(1);
        } else if (contentType.includes('markdown') || contentType.includes('text/plain')) {
          const text = await res.text();
          loading.style.display = 'none';
          if (contentType.includes('markdown') && window.marked && window.DOMPurify) {
            markdownBody.innerHTML = DOMPurify.sanitize(marked.parse(text));
          } else {
            const pre = document.createElement('pre');
            pre.textContent = text;
            markdownBody.appendChild(pre);
          }
          markdownBody.style.display = 'block';
        } else {
          loading.textContent = 'Document type not supported for in-browser preview.';
        }
      } catch (e) {
        loading.style.display = 'none';
        errorMsg.style.display = 'block';
      }
    }

    loadDocument();
  </script>
</body>
</html>
