<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #e8e8e8;
      color: #222;
    }

    /* Toolbar */
    #toolbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 48px;
      background: #1c1c1c;
      color: #eee;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(0,0,0,.4);
    }
    #doc-title {
      font-size: 13px;
      color: #ccc;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #page-info {
      font-size: 12px;
      color: #999;
      white-space: nowrap;
    }
    #download-btn {
      background: #3a3a3a;
      color: #eee;
      border: 1px solid #555;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 12px;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.15s;
    }
    #download-btn:hover { background: #555; }

    /* Canvas area */
    #canvas-wrap {
      padding-top: 56px;
      padding-bottom: 32px;
    }
    #canvas-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 8px;
    }
    canvas {
      display: block;
      margin: 12px auto;
      box-shadow: 0 2px 10px rgba(0,0,0,.3);
      background: #fff;
      max-width: 100%;
    }

    /* Expiry notice */
    .expires {
      font-size: 11px;
      color: #aaa;
      text-align: center;
      margin-top: 8px;
    }

    /* Loading / error states */
    #status-msg {
      text-align: center;
      padding: 48px 16px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <span id="doc-title">{{TITLE}}</span>
    <span id="page-info"></span>
    <a id="download-btn" href="/api/share/{{SLUG}}" download>Download</a>
  </div>

  <div id="canvas-wrap">
    <div id="canvas-container">
      {{EXPIRES_LINE}}
      <div id="status-msg">Loading document…</div>
    </div>
  </div>

  <script type="module">
    const SLUG = '{{SLUG}}';
    const DOC_URL = `/api/share/${SLUG}`;

    const statusEl = document.getElementById('status-msg');
    const pageInfoEl = document.getElementById('page-info');
    const container = document.getElementById('canvas-container');

    async function renderPDF() {
      try {
        const { getDocument, GlobalWorkerOptions } = await import(
          'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.3.136/build/pdf.mjs'
        );
        GlobalWorkerOptions.workerSrc =
          'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.3.136/build/pdf.worker.mjs';

        const loadingTask = getDocument({ url: DOC_URL, withCredentials: true });
        const pdf = await loadingTask.promise;

        statusEl.remove();
        pageInfoEl.textContent = `${pdf.numPages} page${pdf.numPages === 1 ? '' : 's'}`;

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const devicePx = window.devicePixelRatio || 1;
          const viewport = page.getViewport({ scale: 1.5 * devicePx });
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          canvas.style.width = `${viewport.width / devicePx}px`;
          canvas.style.height = `${viewport.height / devicePx}px`;
          container.appendChild(canvas);
          await page.render({ canvasContext: ctx, viewport }).promise;
        }
      } catch (err) {
        console.error('PDF load error:', err);
        statusEl.textContent = 'Could not load the document. The link may have expired.';
      }
    }

    renderPDF();
  </script>
</body>
</html>
