<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link unavailable</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, serif;
      background: #fff;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px;
    }
    .card {
      max-width: 480px;
      text-align: center;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: normal;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
      color: #444;
    }
    p {
      font-size: 0.95rem;
      color: #666;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>This link is no longer available.</h1>
    <p>The document you requested has expired or the link is invalid.</p>
  </div>
</body>
</html>
