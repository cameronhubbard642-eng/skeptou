<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Sképtou</title>

  <!-- PWA / Icons -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#301934" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Sképtou" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
  <link rel="shortcut icon" href="/icons/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ─── Reset ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ─── Design tokens (Sképtou / ucr-borges) ───────────────────── */
    :root {
      --parchment:   #fcf5e5;
      --purple:      #301934;
      --mauve:       #915f6d;
      --wine:        #722f37;
      --quartz:      #51414f;
      --rule-weight: 0.6pt;
    }

    /* ─── Base ────────────────────────────────────────────────────── */
    html, body {
      height: 100%;
      background-color: var(--parchment);
      color: var(--purple);
      font-family: 'Cormorant', Georgia, 'Times New Roman', serif;
      font-weight: 300;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Layout ──────────────────────────────────────────────────── */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 2rem;
    }

    .card {
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    /* ─── Title ───────────────────────────────────────────────────── */
    .site-name {
      font-family: 'Cinzel', 'Palatino Linotype', Palatino, serif;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--purple);
      margin-bottom: 1.25rem;
    }

    /* ─── Mauve hairline rule ─────────────────────────────────────── */
    .rule {
      border: none;
      border-top: var(--rule-weight) solid var(--mauve);
      width: 72px;
      margin: 0 auto 1.25rem;
    }

    /* ─── Tagline ─────────────────────────────────────────────────── */
    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      font-style: italic;
      font-weight: 300;
      color: var(--quartz);
      letter-spacing: 0.02em;
      margin-bottom: 2rem;
    }

    /* ─── Section label (small caps) ─────────────────────────────── */
    .section-label {
      font-size: 0.72rem;
      font-variant: small-caps;
      letter-spacing: 0.14em;
      color: var(--mauve);
      text-transform: lowercase; /* combined with small-caps for true SC effect */
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="site-name">Sképtou</h1>
    <hr class="rule" aria-hidden="true" />
    <p class="tagline">Something is coming.</p>
    <p class="section-label">§&thinsp;Under construction</p>
  </div>
</body>
</html>
