<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — {{BRAND_NAME}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #fcf5e5;
      color: #301934;
      font-family: 'Cormorant', Georgia, serif;
      font-size: 18px;
      line-height: 1.5;
    }
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      width: 100%;
      max-width: 400px;
      border: 1px solid #915f6d;
    }
    .card-header {
      padding: 1.75rem 2rem;
      border-bottom: 1px solid #915f6d;
    }
    .brand {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: #915f6d;
      text-decoration: none;
      text-transform: uppercase;
    }
    .card-body { padding: 2rem; }
    h1 {
      font-size: 1.4rem;
      font-weight: 300;
      color: #301934;
      margin-bottom: 0.5rem;
      letter-spacing: 0.02em;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #51414f;
      margin-bottom: 1.75rem;
    }
    .error-msg {
      background: #fff0f0;
      border: 1px solid #722f37;
      color: #722f37;
      font-size: 0.9rem;
      padding: 0.65rem 0.9rem;
      margin-bottom: 1.25rem;
      display: none;
    }
    .error-msg.visible { display: block; }
    label {
      display: block;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #51414f;
      margin-bottom: 0.4rem;
    }
    input[type="email"] {
      display: block;
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1px solid #915f6d;
      background: #fcf5e5;
      color: #301934;
      font-family: 'Cormorant', Georgia, serif;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="email"]:focus { border-color: #301934; }
    .submit-btn {
      display: block;
      width: 100%;
      margin-top: 1.25rem;
      padding: 0.75rem;
      background: #301934;
      color: #fcf5e5;
      font-family: 'Cormorant', Georgia, serif;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
    }
    .submit-btn:hover { background: #4a2a50; }
    .submit-btn:disabled { opacity: 0.6; cursor: default; }
    .card-footer {
      padding: 1rem 2rem;
      border-top: 1px solid #915f6d;
      font-size: 0.82rem;
      color: #51414f;
      text-align: center;
    }
    .card-footer a { color: #915f6d; text-decoration: none; }
    .card-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="card-header">
        <a href="{{BRAND_URL}}" class="brand">{{BRAND_NAME}}</a>
      </div>
      <div class="card-body">
        <h1>Sign in</h1>
        <p class="subtitle">Enter your email to receive a sign-in link.</p>
        <div class="error-msg" id="error-msg">{{ERROR}}</div>
        <form id="login-form" novalidate>
          <input type="hidden" name="next" value="{{NEXT}}">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" spellcheck="false" required>
          <button type="submit" class="submit-btn" id="submit-btn">Send sign-in link</button>
        </form>
      </div>
      <div class="card-footer">
        <a href="{{BRAND_URL}}">← Back to {{BRAND_NAME}}</a>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var form = document.getElementById('login-form');
      var btn = document.getElementById('submit-btn');
      var errorEl = document.getElementById('error-msg');

      // Show server-rendered error if present
      if (errorEl && errorEl.textContent.trim()) {
        errorEl.classList.add('visible');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = document.getElementById('email').value.trim();
        if (!email) { showError('Please enter your email address.'); return; }

        btn.disabled = true;
        btn.textContent = 'Sending…';

        var next = form.querySelector('input[name="next"]').value;
        fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, next: next || undefined }),
        })
          .then(function (res) {
            if (res.status === 429) {
              return res.json().then(function (d) {
                var mins = Math.ceil((d.retry_after || 60) / 60);
                showError('Too many attempts. Try again in ' + mins + ' minute' + (mins !== 1 ? 's' : '') + '.');
              });
            }
            if (res.status === 400) {
              return res.json().then(function (d) {
                showError(d.error === 'invalid_email' ? 'Please enter a valid email address.' : 'Something went wrong.');
              });
            }
            // Always redirect to check-email (200 = either valid or allowlist miss — no enumeration)
            window.location.href = '/check-email';
          })
          .catch(function () { showError('Network error. Please try again.'); });
      });

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Send sign-in link';
      }
    })();
  </script>
</body>
</html>
