<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check your email — {{BRAND_NAME}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #fcf5e5;
      color: #301934;
      font-family: 'Cormorant', Georgia, serif;
      font-size: 18px;
      line-height: 1.5;
    }
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      width: 100%;
      max-width: 400px;
      border: 1px solid #915f6d;
    }
    .card-header {
      padding: 1.75rem 2rem;
      border-bottom: 1px solid #915f6d;
    }
    .brand {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: #915f6d;
      text-decoration: none;
      text-transform: uppercase;
    }
    .card-body { padding: 2rem; }
    h1 {
      font-size: 1.4rem;
      font-weight: 300;
      color: #301934;
      margin-bottom: 0.75rem;
      letter-spacing: 0.02em;
    }
    p { color: #51414f; font-size: 1rem; margin-bottom: 0.75rem; }
    p:last-child { margin-bottom: 0; }
    .note {
      margin-top: 1.25rem;
      font-size: 0.88rem;
      color: #51414f;
      border-top: 1px solid #915f6d;
      padding-top: 1rem;
    }
    .card-footer {
      padding: 1rem 2rem;
      border-top: 1px solid #915f6d;
      font-size: 0.82rem;
      color: #51414f;
      text-align: center;
    }
    .card-footer a { color: #915f6d; text-decoration: none; }
    .card-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="card-header">
        <a href="{{BRAND_URL}}" class="brand">{{BRAND_NAME}}</a>
      </div>
      <div class="card-body">
        <h1>Check your email</h1>
        <p>A sign-in link has been sent to your inbox. Click the link to continue.</p>
        <p>The link expires in 10&nbsp;minutes and can only be used once.</p>
        <p class="note">If you don't receive the email, check your spam folder. If you entered the wrong address, <a href="/login" style="color:#915f6d;">try again</a>.</p>
      </div>
      <div class="card-footer">
        <a href="{{BRAND_URL}}">← Back to {{BRAND_NAME}}</a>
      </div>
    </div>
  </div>
</body>
</html>
