<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Aristeia — Viewer</title>

  <!-- Design system -->
  <link rel="stylesheet" href="/design-tokens.css" />
  <link rel="stylesheet" href="/skeptou.css" />

  <!-- Cinzel for ornamental elements -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&display=swap" rel="stylesheet" />

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
  /* ── Viewer layout ──────────────────────────────────────────────────── */

  .viewer-layout {
    display: flex;
    height: calc(100vh - 57px); /* subtract nav height */
    overflow: hidden;
  }

  /* Citation sidebar */
  .sidebar {
    width: 280px;
    min-width: 220px;
    max-width: 320px;
    flex-shrink: 0;
    overflow-y: auto;
    border-right: 1px solid rgba(145,95,109,.25);
    padding: 1.5rem 1.25rem;
    background: var(--color-parchment, #fcf5e5);
  }

  .sidebar__title {
    font-variant-caps: small-caps;
    letter-spacing: .04em;
    color: var(--color-purple, #301934);
    font-size: 1rem;
    line-height: 1.35;
    margin-bottom: .75rem;
  }

  .sidebar__authors {
    font-size: .82rem;
    color: var(--color-quartz, #51414f);
    margin-bottom: .75rem;
    font-style: italic;
  }

  .sidebar__rule {
    border: none;
    border-top: 1px solid rgba(145,95,109,.3);
    margin-block: .875rem;
  }

  .sidebar__meta-label {
    font-variant-caps: small-caps;
    letter-spacing: .07em;
    font-size: .66rem;
    color: var(--color-mauve, #915f6d);
    display: block;
    margin-bottom: .15rem;
  }

  .sidebar__meta-value {
    font-size: .8rem;
    color: var(--color-purple, #301934);
    margin-bottom: .7rem;
    display: block;
    word-break: break-word;
  }

  .sidebar__meta-value a {
    color: var(--color-steel, #4682b4);
    text-decoration: none;
    font-size: .75rem;
  }
  .sidebar__meta-value a:hover { color: var(--color-wine, #722f37); }

  .sidebar__notes {
    font-size: .8rem;
    color: var(--color-quartz, #51414f);
    line-height: 1.55;
    white-space: pre-wrap;
  }

  /* History version select */
  .sidebar__history-select {
    font-family: inherit;
    font-size: .78rem;
    background: var(--color-parchment, #fcf5e5);
    border: 1px solid rgba(145,95,109,.4);
    color: var(--color-purple, #301934);
    padding: .25em .5em;
    width: 100%;
    cursor: pointer;
    margin-top: .25rem;
  }

  .sidebar__history-notice {
    font-size: .72rem;
    color: var(--color-wine, #722f37);
    font-style: italic;
    margin-top: .5rem;
    display: none;
  }

  /* PDF canvas area */
  .pdf-area {
    flex: 1;
    overflow-y: auto;
    background: #6b6158;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem 1rem;
    gap: 1rem;
  }

  .pdf-area canvas {
    display: block;
    box-shadow: 0 2px 12px rgba(0,0,0,.35);
    max-width: 100%;
  }

  .pdf-controls {
    display: flex;
    align-items: center;
    gap: .75rem;
    background: rgba(48,25,52,.75);
    padding: .4rem .9rem;
    border-radius: 2px;
    font-size: .78rem;
    color: #e8dcc8;
    font-family: inherit;
    font-variant-caps: small-caps;
    letter-spacing: .06em;
    position: sticky;
    top: .5rem;
    z-index: 10;
    align-self: center;
  }

  .pdf-controls button {
    background: transparent;
    border: 1px solid rgba(232,220,200,.4);
    color: #e8dcc8;
    font-family: inherit;
    font-size: .75rem;
    padding: .15em .6em;
    cursor: pointer;
    transition: background .12s;
  }
  .pdf-controls button:hover { background: rgba(232,220,200,.15); }
  .pdf-controls button:disabled { opacity: .35; cursor: not-allowed; }

  .pdf-loading {
    color: #e8dcc8;
    font-style: italic;
    font-size: .9rem;
    padding: 3rem 0;
    font-family: inherit;
  }

  .pdf-error {
    color: var(--color-coral, #f08080);
    font-size: .85rem;
    font-style: italic;
    padding: 2rem;
    text-align: center;
    max-width: 40ch;
  }

  /* Sidebar toggle on mobile */
  .sidebar-toggle {
    display: none;
    background: transparent;
    border: 1px solid rgba(145,95,109,.4);
    color: var(--color-mauve, #915f6d);
    font-family: inherit;
    font-variant-caps: small-caps;
    font-size: .72rem;
    letter-spacing: .06em;
    padding: .25em .75em;
    cursor: pointer;
    margin-left: auto;
  }

  .sk-nav__breadcrumb {
    font-size: .78rem;
    color: var(--color-quartz, #51414f);
    display: flex;
    align-items: center;
    gap: .4rem;
    font-variant-caps: small-caps;
    letter-spacing: .04em;
  }
  .sk-nav__breadcrumb a {
    color: var(--color-mauve, #915f6d);
    text-decoration: none;
  }
  .sk-nav__breadcrumb a:hover { color: var(--color-wine, #722f37); }

  @media (max-width: 768px) {
    .viewer-layout {
      flex-direction: column;
      height: auto;
    }

    .sidebar {
      width: 100%;
      max-width: 100%;
      border-right: none;
      border-bottom: 1px solid rgba(145,95,109,.25);
      padding: 1rem;
    }

    .sidebar.collapsed { display: none; }

    .sidebar-toggle { display: inline-block; }

    .pdf-area {
      min-height: 60vh;
      padding: .75rem .5rem;
    }
  }
  </style>
</head>
<body class="private">

  <nav class="sk-nav" aria-label="Main" style="justify-content:space-between">
    <div class="sk-nav__breadcrumb">
      <a href="/">Aristeia</a>
      <span style="opacity:.5">›</span>
      <span id="nav-title">Viewer</span>
    </div>
    <button class="sidebar-toggle" id="sidebar-toggle" aria-expanded="true" aria-controls="sidebar">
      ◂ Info
    </button>
  </nav>

  <div class="viewer-layout">

    <!-- Citation sidebar -->
    <aside class="sidebar" id="sidebar">
      <div id="sidebar-content">
        <p class="sk-loading">Loading…</p>
      </div>
    </aside>

    <!-- PDF canvas area -->
    <div class="pdf-area" id="pdf-area">
      <div class="pdf-loading" id="pdf-loading">Loading document…</div>
      <div class="pdf-controls" id="pdf-controls" style="display:none">
        <button id="btn-prev" disabled>◂</button>
        <span id="page-indicator">1 / 1</span>
        <button id="btn-next" disabled>▸</button>
        <span style="opacity:.5">·</span>
        <button id="btn-zoom-out">−</button>
        <span id="zoom-label">100%</span>
        <button id="btn-zoom-in">+</button>
      </div>
      <div id="pdf-canvases"></div>
    </div>

  </div>

  <script>
  (function () {
    'use strict';

    /* ── URL param ── */
    const slug = new URLSearchParams(location.search).get('slug');
    if (!slug) {
      document.getElementById('pdf-loading').innerHTML =
        '<span class="pdf-error">No publication slug specified.</span>';
      document.getElementById('sidebar-content').innerHTML =
        '<p class="sk-error">No slug in URL.</p>';
      return;
    }

    /* ── PDF.js worker ── */
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let pdfDoc     = null;
    let pageNum    = 1;
    let scale      = 1.4;
    let currentKey = null; /* tracks which content URL is loaded */

    /* ── Metadata fetch ── */
    async function loadMetadata() {
      const res = await fetch('/api/publications/' + encodeURIComponent(slug));
      if (res.status === 401) {
        document.getElementById('sidebar-content').innerHTML =
          '<p class="sk-error">Session expired — please reload.</p>';
        return null;
      }
      if (res.status === 404) {
        document.getElementById('sidebar-content').innerHTML =
          '<p class="sk-error">Publication not found.</p>';
        return null;
      }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      return json.data;
    }

    function renderSidebar(pub) {
      const citation = pub.citation || {};
      const authors  = Array.isArray(pub.authors) ? pub.authors.join(', ') : '';

      document.title = 'Aristeia — ' + pub.title;
      document.getElementById('nav-title').textContent = pub.title;

      const status  = pub.status || '';
      const version = pub.current_version ? ' · ' + pub.current_version : '';

      const rows = [];

      if (citation.journal) rows.push(row('Journal', esc(citation.journal)));
      if (citation.volume || citation.issue) {
        const vi = [citation.volume && 'vol. ' + citation.volume,
                    citation.issue  && 'no. '  + citation.issue].filter(Boolean).join(', ');
        rows.push(row('Volume / Issue', esc(vi)));
      }
      if (citation.year)      rows.push(row('Year',   esc(String(citation.year))));
      if (citation.pages)     rows.push(row('Pages',  esc(citation.pages)));
      if (citation.publisher) rows.push(row('Publisher', esc(citation.publisher)));
      if (citation.venue)     rows.push(row('Venue',  esc(citation.venue)));
      if (citation.doi) {
        const href = 'https://doi.org/' + encodeURIComponent(citation.doi);
        rows.push(row('DOI', '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + esc(citation.doi) + '</a>'));
      }
      if (citation.url) {
        rows.push(row('URL', '<a href="' + esc(citation.url) + '" target="_blank" rel="noopener noreferrer">Open</a>'));
      }
      if (citation.status) rows.push(row('Status', esc(citation.status)));

      /* History dropdown */
      const history = pub.import_history || [];
      const historyHtml = history.length ? [
        '<hr class="sidebar__rule" />',
        '<span class="sidebar__meta-label">Version</span>',
        '<select class="sidebar__history-select" id="version-select">',
        '  <option value="">Current (' + esc(pub.current_version || 'latest') + ')</option>',
        history.map(function(h) {
          const d = h.imported_at ? h.imported_at.slice(0,10) : '';
          const v = h.version_tag || 'unknown';
          return '  <option value="' + h.id + '">' + esc(v) + ' — ' + esc(d) + '</option>';
        }).join('\n'),
        '</select>',
        '<p class="sidebar__history-notice" id="history-notice">Viewing archived version</p>',
      ].join('\n') : '';

      document.getElementById('sidebar-content').innerHTML = [
        '<p class="sidebar__title">' + esc(pub.title) + '</p>',
        authors ? '<p class="sidebar__authors">' + esc(authors) + '</p>' : '',
        '<span class="sk-badge sk-badge--' + esc(status) + '">' + esc(status.replace(/_/g,' ')) + version + '</span>',
        rows.length ? '<hr class="sidebar__rule" />' + rows.join('') : '',
        historyHtml,
        pub.notes ? [
          '<hr class="sidebar__rule" />',
          '<span class="sidebar__meta-label">Notes</span>',
          '<p class="sidebar__notes">' + esc(pub.notes) + '</p>',
        ].join('') : '',
      ].join('\n');

      /* Version select handler */
      const sel = document.getElementById('version-select');
      if (sel) {
        sel.addEventListener('change', function() {
          const vid = sel.value;
          const notice = document.getElementById('history-notice');
          if (vid) {
            notice.style.display = 'block';
            loadPdf('/api/publications/' + encodeURIComponent(slug) + '/content?version=' + encodeURIComponent(vid));
          } else {
            notice.style.display = 'none';
            loadPdf('/api/publications/' + encodeURIComponent(slug) + '/content');
          }
        });
      }
    }

    function row(label, value) {
      return '<span class="sidebar__meta-label">' + label + '</span>' +
             '<span class="sidebar__meta-value">' + value + '</span>';
    }

    function esc(str) {
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    /* ── PDF rendering ── */
    async function loadPdf(url) {
      if (currentKey === url) return;
      currentKey = url;

      const loading  = document.getElementById('pdf-loading');
      const canvases = document.getElementById('pdf-canvases');
      const controls = document.getElementById('pdf-controls');

      loading.style.display  = 'block';
      loading.textContent    = 'Loading document…';
      canvases.innerHTML     = '';
      controls.style.display = 'none';
      pageNum                = 1;
      pdfDoc                 = null;

      try {
        pdfDoc = await pdfjsLib.getDocument({ url, withCredentials: true }).promise;
        loading.style.display  = 'none';
        controls.style.display = 'flex';
        updateControls();
        await renderAllPages();
      } catch (err) {
        loading.innerHTML = '<span class="pdf-error">Could not load PDF. ' + esc(err.message) + '</span>';
      }
    }

    async function renderAllPages() {
      if (!pdfDoc) return;
      const canvases = document.getElementById('pdf-canvases');
      canvases.innerHTML = '';

      for (let p = 1; p <= pdfDoc.numPages; p++) {
        const page    = await pdfDoc.getPage(p);
        const vp      = page.getViewport({ scale });
        const canvas  = document.createElement('canvas');
        canvas.height = vp.height;
        canvas.width  = vp.width;
        canvases.appendChild(canvas);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      }
    }

    function updateControls() {
      if (!pdfDoc) return;
      document.getElementById('page-indicator').textContent =
        pageNum + ' / ' + pdfDoc.numPages;
      document.getElementById('btn-prev').disabled = pageNum <= 1;
      document.getElementById('btn-next').disabled = pageNum >= pdfDoc.numPages;
      document.getElementById('zoom-label').textContent = Math.round(scale * 100) + '%';
    }

    /* ── Controls ── */
    document.getElementById('btn-prev').addEventListener('click', function() {
      if (pageNum > 1) { pageNum--; scrollToPage(pageNum); updateControls(); }
    });
    document.getElementById('btn-next').addEventListener('click', function() {
      if (pdfDoc && pageNum < pdfDoc.numPages) { pageNum++; scrollToPage(pageNum); updateControls(); }
    });
    document.getElementById('btn-zoom-in').addEventListener('click', function() {
      scale = Math.min(scale + 0.2, 3.0);
      renderAllPages();
      updateControls();
    });
    document.getElementById('btn-zoom-out').addEventListener('click', function() {
      scale = Math.max(scale - 0.2, 0.4);
      renderAllPages();
      updateControls();
    });

    function scrollToPage(n) {
      const canvases = document.getElementById('pdf-canvases').children;
      if (canvases[n - 1]) canvases[n - 1].scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ── Sidebar toggle (mobile) ── */
    document.getElementById('sidebar-toggle').addEventListener('click', function() {
      const sidebar = document.getElementById('sidebar');
      const btn     = document.getElementById('sidebar-toggle');
      const open    = !sidebar.classList.contains('collapsed');
      sidebar.classList.toggle('collapsed', open);
      btn.setAttribute('aria-expanded', String(!open));
      btn.textContent = open ? '▸ Info' : '◂ Info';
    });

    /* ── Bootstrap ── */
    (async function bootstrap() {
      try {
        const pub = await loadMetadata();
        if (!pub) return;
        renderSidebar(pub);
        await loadPdf('/api/publications/' + encodeURIComponent(slug) + '/content');
      } catch (err) {
        document.getElementById('sidebar-content').innerHTML =
          '<p class="sk-error">Error loading publication: ' + esc(err.message) + '</p>';
        document.getElementById('pdf-loading').innerHTML =
          '<span class="pdf-error">Error: ' + esc(err.message) + '</span>';
      }
    })();

  })();
  </script>

</body>
</html>
