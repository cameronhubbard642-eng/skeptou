name: Compile canonical PDFs

on:
  push:
    branches: [energeia]
    paths:
      - 'papers/**/*.tex'
      - 'templates/**'
  workflow_dispatch:
    inputs:
      slug:
        description: Paper slug to recompile (e.g. nans-genealogy-abstract)
        required: true
        type: string

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout agora energeia branch
        uses: actions/checkout@v4
        with:
          ref: energeia
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed papers
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED="${{ inputs.slug }}"
          else
            # Find paper slugs with changed .tex files in this push.
            # Normalize Scrivener .tex-folder variant: papers/<slug>.tex/<file>.tex → slug
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'papers/**/*.tex' \
              | sed 's|papers/||' | cut -d/ -f1 \
              | sed 's/\.tex$//' \
              | sort -u | tr '\n' ' ')
          fi
          echo "SLUGS=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed paper slugs: $CHANGED"

      - name: Install TeX Live (XeLaTeX + latexmk)
        if: steps.changed.outputs.SLUGS != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-fonts-recommended texlive-latex-extra \
            texlive-bibtex-extra texlive-fonts-extra \
            latexmk biber

      - name: Register TeX-installed OTF/TTF fonts with fontconfig
        if: steps.changed.outputs.SLUGS != ''
        run: |
          sudo fc-cache -f /usr/share/texlive/texmf-dist/fonts/opentype/ \
                        /usr/share/texlive/texmf-dist/fonts/truetype/ 2>/dev/null || true
          fc-cache -f

      - name: Configure TEXINPUTS for Cameron Personal Style
        if: steps.changed.outputs.SLUGS != ''
        run: echo "TEXINPUTS=.:$(pwd)/templates//:" >> $GITHUB_ENV

      - name: Compile each changed paper
        if: steps.changed.outputs.SLUGS != ''
        run: |
          FAILED=""
          for SLUG in ${{ steps.changed.outputs.SLUGS }}; do
            PAPER_DIR="papers/$SLUG"
            # Find the main .tex wherever Scrivener placed it — flat
            # papers/<slug>/main.tex or nested papers/<slug>/<title>.tex/<file>.tex.
            if [ -f "$PAPER_DIR/main.tex" ]; then
              MAIN_TEX="$PAPER_DIR/main.tex"
            else
              MAIN_TEX=$(find "$PAPER_DIR" -name "*.tex" -not -name "mmd6-*" 2>/dev/null | sort | head -1)
            fi
            if [ -z "$MAIN_TEX" ]; then
              echo "Skipping $SLUG — no main .tex found under $PAPER_DIR (not yet promoted to energeia)"
              mkdir -p "papers/${SLUG}"
              NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              python3 -c 'import json,sys; print(json.dumps({"ok":False,"error":sys.argv[1],"compiledAt":sys.argv[2],"runUrl":sys.argv[3]}))' \
                "Paper not promoted to energeia yet — use Compile Draft on the dunamis branch." \
                "$NOW" "$RUN_URL" > "papers/${SLUG}/compile-status.json"
              continue
            fi
            TEX_BASE=$(basename "$MAIN_TEX")
            COMPILE_DIR=$(dirname "$MAIN_TEX")

            # Detect format from slugs.yaml (first format in the formats: list)
            FORMAT=$(awk -v target="$SLUG" '
              /^- slug:/ {
                line = $0
                gsub(/^[[:space:]]*-[[:space:]]*slug:[[:space:]]*/, "", line)
                gsub(/"/, "", line)
                in_target = (line == target)
              }
              in_target && /[[:space:]]formats:/ {
                gsub(/.*formats:[[:space:]]*/, "")
                gsub(/[\[\]"]/, "")
                split($0, a, ",")
                val = a[1]
                gsub(/[[:space:]]/, "", val)
                print val
                exit
              }
            ' slugs.yaml)
            FORMAT=${FORMAT:-article}

            ln -sfn "${GITHUB_WORKSPACE}/templates/personal_style" \
                    "${COMPILE_DIR}/personal_style"
            if [ -f "${PAPER_DIR}/main.bib" ] && [ "${COMPILE_DIR}" != "${PAPER_DIR}" ]; then
              cp "${PAPER_DIR}/main.bib" "${COMPILE_DIR}/main.bib"
            fi
            [ ! -f "${COMPILE_DIR}/main.bib" ] && touch "${COMPILE_DIR}/main.bib" || true
            echo "=== Compiling ${COMPILE_DIR}/$TEX_BASE (format=$FORMAT) ==="

            if [ "$FORMAT" = "slides" ]; then
              mkdir -p "compiled/$SLUG"
              cd "$COMPILE_DIR"
              xelatex -interaction=nonstopmode -halt-on-error \
                -jobname="${SLUG}-slides" "\def\DeckMode{}\input{$TEX_BASE}" || \
                FAILED="$FAILED $SLUG"
              [ -f "${SLUG}-slides.pdf" ] && \
                cp "${SLUG}-slides.pdf" "${GITHUB_WORKSPACE}/compiled/$SLUG/${SLUG}-slides.pdf"
              cd "${GITHUB_WORKSPACE}"
            elif [ "$FORMAT" = "dual" ]; then
              mkdir -p "compiled/$SLUG"
              cd "$COMPILE_DIR"
              xelatex -interaction=nonstopmode -halt-on-error \
                -jobname="${SLUG}-slides" "\def\DeckMode{}\input{$TEX_BASE}" || \
                FAILED="$FAILED $SLUG"
              xelatex -interaction=nonstopmode -halt-on-error \
                -jobname="${SLUG}-handout" "\def\HandoutMode{}\input{$TEX_BASE}" || \
                FAILED="$FAILED $SLUG"
              [ -f "${SLUG}-slides.pdf" ] && \
                cp "${SLUG}-slides.pdf"  "${GITHUB_WORKSPACE}/compiled/$SLUG/${SLUG}-slides.pdf"
              [ -f "${SLUG}-handout.pdf" ] && \
                cp "${SLUG}-handout.pdf" "${GITHUB_WORKSPACE}/compiled/$SLUG/${SLUG}-handout.pdf"
              cd "${GITHUB_WORKSPACE}"
            else
              cd "$COMPILE_DIR"
              latexmk -xelatex -interaction=nonstopmode -halt-on-error "$TEX_BASE" || \
                FAILED="$FAILED $SLUG"
              cd "${GITHUB_WORKSPACE}"
              # Publish at the canonical papers/<slug>/main.pdf — the path the
              # PDF Worker fetches — wherever the .tex compiled from.
              CANON_PDF="${COMPILE_DIR}/${TEX_BASE%.tex}.pdf"
              if [ -f "$CANON_PDF" ] && [ "$CANON_PDF" != "papers/${SLUG}/main.pdf" ]; then
                mkdir -p "papers/${SLUG}"
                cp "$CANON_PDF" "papers/${SLUG}/main.pdf"
              fi
            fi

            # Record per-paper compile status (ok flag + LaTeX error message)
            mkdir -p "papers/${SLUG}"
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            if echo " $FAILED " | grep -q " $SLUG "; then
              ERR=$(grep -h -A5 '^!' "${COMPILE_DIR}"/*.log 2>/dev/null | head -40)
              [ -z "$ERR" ] && ERR="Compilation failed — see the full run log."
              python3 -c 'import json,sys; print(json.dumps({"ok":False,"error":sys.argv[1],"compiledAt":sys.argv[2],"runUrl":sys.argv[3]}))' \
                "$ERR" "$NOW" "$RUN_URL" > "papers/${SLUG}/compile-status.json"
            else
              python3 -c 'import json,sys; print(json.dumps({"ok":True,"compiledAt":sys.argv[1],"runUrl":sys.argv[2]}))' \
                "$NOW" "$RUN_URL" > "papers/${SLUG}/compile-status.json"
            fi
          done
          echo "FAILED=$FAILED" >> "$GITHUB_ENV"

      - name: Commit compiled PDFs and status
        if: steps.changed.outputs.SLUGS != ''
        run: |
          git config user.name  "energeia-bot"
          git config user.email "energeia@skeptou.com"
          git add 'papers/**/*.pdf' 'compiled/**/*.pdf' || true
          git add 'papers/**/compile-status.json'
          if git diff --cached --quiet; then
            echo "No papers compiled — nothing to commit."
          else
            git commit -m "energeia: compile canonical PDFs [automated]"
            git push origin energeia
          fi
          [ -z "${FAILED// }" ] || { echo "Papers failed to compile:${FAILED}"; exit 1; }
