name: Compile draft PDF

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Dunamis branch (e.g. dunamis/epistemic-akrasia-alpha)
        required: true
        type: string
      slug:
        description: Paper slug
        required: true
        type: string

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout agora on dunamis branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate inputs and detect main .tex
        id: setup
        run: |
          SLUG="${{ inputs.slug }}"
          BRANCH="${{ inputs.branch }}"
          if ! echo "$BRANCH" | grep -qE '^dunamis/[a-z0-9-]+-[a-z]+$'; then
            echo "Invalid branch: $BRANCH" && exit 1
          fi
          PAPER_DIR="papers/$SLUG"
          # The Scrivener compile output is a folder "<project-title>.tex/" that
          # holds the real .tex plus mmd6-* helpers, sitting inside papers/<slug>/.
          # Find the main .tex wherever it lands — flat papers/<slug>/main.tex or
          # nested papers/<slug>/<title>.tex/<file>.tex — skipping mmd6 helpers.
          if [ -f "$PAPER_DIR/main.tex" ]; then
            MAIN_TEX="$PAPER_DIR/main.tex"
          else
            MAIN_TEX=$(find "$PAPER_DIR" -name "*.tex" -not -name "mmd6-*" 2>/dev/null | sort | head -1)
          fi
          if [ -z "$MAIN_TEX" ]; then
            echo "No main .tex found under $PAPER_DIR — skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            TEX_BASE=$(basename "$MAIN_TEX")
            COMPILE_DIR=$(dirname "$MAIN_TEX")
            DIRECTION=$(echo "$BRANCH" | sed "s|dunamis/${SLUG}-||")
            echo "Main .tex: $MAIN_TEX  (compile dir: $COMPILE_DIR)"
            echo "TEX_BASE=$TEX_BASE"        >> $GITHUB_ENV
            echo "COMPILE_DIR=$COMPILE_DIR"  >> $GITHUB_ENV
            echo "PAPER_DIR=$PAPER_DIR"      >> $GITHUB_ENV
            echo "DIRECTION=$DIRECTION"      >> $GITHUB_ENV
            echo "skip=false"               >> $GITHUB_OUTPUT
          fi

      - name: Detect paper format from energeia slugs.yaml
        if: success() && steps.setup.outputs.skip != 'true'
        run: |
          SLUG="${{ inputs.slug }}"
          git fetch origin energeia --depth=1 2>/dev/null || true
          FORMAT=$(git show origin/energeia:slugs.yaml 2>/dev/null | awk -v target="$SLUG" '
            /^- slug:/ {
              line = $0
              gsub(/^[[:space:]]*-[[:space:]]*slug:[[:space:]]*/, "", line)
              gsub(/"/, "", line)
              in_target = (line == target)
            }
            in_target && /[[:space:]]formats:/ {
              gsub(/.*formats:[[:space:]]*/, "")
              gsub(/[\[\]"]/, "")
              split($0, a, ",")
              val = a[1]
              gsub(/[[:space:]]/, "", val)
              print val
              exit
            }
          ')
          FORMAT=${FORMAT:-article}
          echo "FORMAT=$FORMAT" >> $GITHUB_ENV

      - name: Install TeX Live (XeLaTeX + latexmk)
        if: success() && steps.setup.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-fonts-recommended texlive-latex-extra \
            texlive-bibtex-extra texlive-fonts-extra \
            latexmk biber

      - name: Register TeX-installed OTF/TTF fonts with fontconfig
        if: success() && steps.setup.outputs.skip != 'true'
        run: |
          sudo fc-cache -f /usr/share/texlive/texmf-dist/fonts/opentype/ \
                        /usr/share/texlive/texmf-dist/fonts/truetype/ 2>/dev/null || true
          fc-cache -f

      - name: Link Cameron_Personal_Style beside the .tex
        if: success() && steps.setup.outputs.skip != 'true'
        run: |
          # The .sty loads fonts via ./personal_style/fonts/... relative to the
          # compile dir, so the symlink must sit beside the .tex being compiled.
          ln -sfn "${GITHUB_WORKSPACE}/templates/personal_style" \
                  "${COMPILE_DIR}/personal_style"

      - name: Configure TEXINPUTS for Cameron Personal Style
        if: success() && steps.setup.outputs.skip != 'true'
        run: echo "TEXINPUTS=.:$(pwd)/templates//:" >> $GITHUB_ENV

      - name: Ensure bibliography is beside the .tex
        if: success() && steps.setup.outputs.skip != 'true'
        run: |
          # main.bib lives at papers/<slug>/main.bib; when the .tex is nested in
          # a Scrivener <title>.tex/ folder, copy the .bib beside it so
          # \addbibresource{main.bib} resolves at compile time.
          if [ -f "${PAPER_DIR}/main.bib" ] && [ "${COMPILE_DIR}" != "${PAPER_DIR}" ]; then
            cp "${PAPER_DIR}/main.bib" "${COMPILE_DIR}/main.bib"
          fi
          [ ! -f "${COMPILE_DIR}/main.bib" ] && touch "${COMPILE_DIR}/main.bib" || true

      - name: Compile with XeLaTeX
        if: success() && steps.setup.outputs.skip != 'true'
        run: |
          cd "$COMPILE_DIR"
          COMPILE_RC=0
          if [ "$FORMAT" = "slides" ]; then
            xelatex -interaction=nonstopmode -halt-on-error \
              -jobname="draft-${DIRECTION}-slides" "\def\DeckMode{}\input{$TEX_BASE}" || COMPILE_RC=1
          elif [ "$FORMAT" = "dual" ]; then
            xelatex -interaction=nonstopmode -halt-on-error \
              -jobname="draft-${DIRECTION}-slides" "\def\DeckMode{}\input{$TEX_BASE}" || COMPILE_RC=1
            xelatex -interaction=nonstopmode -halt-on-error \
              -jobname="draft-${DIRECTION}-handout" "\def\HandoutMode{}\input{$TEX_BASE}" || COMPILE_RC=1
          else
            latexmk -xelatex -interaction=nonstopmode -halt-on-error "$TEX_BASE" || COMPILE_RC=1
          fi
          echo "COMPILE_RC=$COMPILE_RC" >> "$GITHUB_ENV"

      # Records papers/<slug>/compile-status.json on every run: { ok, error?, compiledAt, runUrl }.
      # On success the PDF is committed too; on failure the LaTeX errors are captured
      # so the energeia PDF Worker can surface them instead of a generic 404.
      - name: Record compile status and commit
        if: success() && steps.setup.outputs.skip != 'true'
        run: |
          git config user.name  "energeia-bot"
          git config user.email "energeia@skeptou.com"
          SLUG="${{ inputs.slug }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p "papers/${SLUG}"
          STATUS="papers/${SLUG}/compile-status.json"

          if [ "${COMPILE_RC:-1}" = "0" ]; then
            if [ "$FORMAT" = "slides" ] || [ "$FORMAT" = "dual" ]; then
              git add "${COMPILE_DIR}"/*.pdf
            else
              PDF="${COMPILE_DIR}/${TEX_BASE%.tex}.pdf"
              if [ -f "$PDF" ]; then
                # Always publish at the canonical papers/<slug>/main.pdf — the
                # path the PDF Worker fetches — wherever the .tex compiled from.
                if [ "$PDF" != "papers/${SLUG}/main.pdf" ]; then
                  cp "$PDF" "papers/${SLUG}/main.pdf"
                fi
                git add "papers/${SLUG}/main.pdf"
              fi
            fi
            python3 -c 'import json,sys; print(json.dumps({"ok":True,"compiledAt":sys.argv[1],"runUrl":sys.argv[2]}))' \
              "$NOW" "$RUN_URL" > "$STATUS"
          else
            ERR=$(grep -h -A5 '^!' "${COMPILE_DIR}"/*.log 2>/dev/null | head -40)
            [ -z "$ERR" ] && ERR="Compilation failed — see the full run log."
            python3 -c 'import json,sys; print(json.dumps({"ok":False,"error":sys.argv[1],"compiledAt":sys.argv[2],"runUrl":sys.argv[3]}))' \
              "$ERR" "$NOW" "$RUN_URL" > "$STATUS"
          fi

          git add "$STATUS"
          git diff --cached --quiet || \
            git commit -m "energeia: compile draft ${SLUG}-${DIRECTION} [automated]"
          git push origin "${{ inputs.branch }}"
          [ "${COMPILE_RC:-1}" = "0" ] || { echo "Compile failed — status recorded in $STATUS"; exit 1; }