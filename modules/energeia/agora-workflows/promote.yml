name: Promote paper

# Triggered by energeia Worker via POST /api/energeia/promote/:slug
# workflow_dispatch inputs are pre-computed by the Worker.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Source dunamis branch
        required: true
        type: string
      slug:
        description: Paper slug
        required: true
        type: string
      note:
        description: Tag annotation note
        required: false
        default: ''
        type: string
      classification:
        description: major or minor
        required: true
        type: choice
        options:
          - major
          - minor
      class_source:
        description: auto / forced-major / forced-minor
        required: false
        default: auto
        type: string
      next_tag:
        description: Tag to apply (e.g. style-IV or style-III.2)
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout agora (energeia branch)
        uses: actions/checkout@v4
        with:
          ref: energeia
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch dunamis branch
        run: git fetch origin "${{ inputs.branch }}"

      - name: Validate inputs
        run: |
          SLUG="${{ inputs.slug }}"
          BRANCH="${{ inputs.branch }}"
          TAG="${{ inputs.next_tag }}"
          if ! echo "$BRANCH" | grep -qE "^dunamis/${SLUG}-[a-z]+$"; then
            echo "Branch $BRANCH does not match expected pattern" && exit 1
          fi
          if ! echo "$TAG" | grep -qE '^style-[IVXLCDM]+(\.[0-9]+)?$'; then
            echo "Invalid tag format: $TAG" && exit 1
          fi
          if git tag -l "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists — aborting" && exit 1
          fi
          echo "SLUG=$SLUG"     >> $GITHUB_ENV
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "NEXT_TAG=$TAG"  >> $GITHUB_ENV

      - name: Compute actual diff percentage
        id: diff
        run: |
          TOTAL_CHANGED=$(git diff --numstat "origin/energeia...origin/$BRANCH" \
            -- "papers/$SLUG/" | awk '{add+=$1; del+=$2} END {print add+del+0}')
          CANONICAL_LINES=$(git ls-tree -r --name-only origin/energeia -- "papers/$SLUG/" \
            | grep '\.tex$' \
            | xargs -I{} git show "origin/energeia:{}" 2>/dev/null \
            | wc -l)
          CANONICAL_LINES=$([ "$CANONICAL_LINES" -lt 1 ] && echo 1 || echo "$CANONICAL_LINES")
          PCT=$(( TOTAL_CHANGED * 100 / CANONICAL_LINES ))
          echo "diff_pct=$PCT" >> $GITHUB_OUTPUT
          echo "Diff: $TOTAL_CHANGED changed lines of $CANONICAL_LINES canonical = ${PCT}%"

      - name: Copy paper files from dunamis branch
        run: |
          git checkout "origin/$BRANCH" -- "papers/$SLUG/"

      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-fonts-recommended texlive-latex-extra \
            latexmk latexdiff

      - name: Link Cameron_Personal_Style into paper directory
        run: |
          ln -sfn "${GITHUB_WORKSPACE}/templates/personal_style" \
                  "papers/$SLUG/personal_style"

      - name: Configure TEXINPUTS
        run: echo "TEXINPUTS=.:$(pwd)/templates//:" >> $GITHUB_ENV

      - name: Compile canonical PDF
        run: |
          MAIN_TEX=$(find "papers/$SLUG" -maxdepth 1 -name "*.tex" -not -name "mmd6-*" | head -1)
          if [ -z "$MAIN_TEX" ]; then
            echo "No main .tex found in papers/$SLUG — skipping compile"
            echo "MAIN_TEX_BASE=" >> $GITHUB_ENV
            echo "FORMAT=article"  >> $GITHUB_ENV
          else
            TEX_BASE=$(basename "$MAIN_TEX")
            echo "MAIN_TEX_BASE=$TEX_BASE" >> $GITHUB_ENV

            # Detect format from slugs.yaml (already checked out on energeia)
            FORMAT=$(awk -v target="$SLUG" '
              /^- slug:/ {
                line = $0
                gsub(/^[[:space:]]*-[[:space:]]*slug:[[:space:]]*/, "", line)
                gsub(/"/, "", line)
                in_target = (line == target)
              }
              in_target && /[[:space:]]formats:/ {
                gsub(/.*formats:[[:space:]]*/, "")
                gsub(/[\[\]"]/, "")
                split($0, a, ",")
                val = a[1]
                gsub(/[[:space:]]/, "", val)
                print val
                exit
              }
            ' slugs.yaml)
            FORMAT=${FORMAT:-article}
            echo "FORMAT=$FORMAT" >> $GITHUB_ENV

            if [ "$FORMAT" = "slides" ]; then
              mkdir -p "compiled/$SLUG"
              cd "papers/$SLUG"
              xelatex -interaction=nonstopmode -halt-on-error \
                -jobname="${SLUG}-slides" "\def\DeckMode{}\input{$TEX_BASE}" || \
                echo "WARNING: XeLaTeX failed"
              [ -f "${SLUG}-slides.pdf" ] && \
                cp "${SLUG}-slides.pdf" "../../compiled/$SLUG/${SLUG}-slides.pdf"
              cd ../..
            elif [ "$FORMAT" = "dual" ]; then
              mkdir -p "compiled/$SLUG"
              cd "papers/$SLUG"
              xelatex -interaction=nonstopmode -halt-on-error \
                -jobname="${SLUG}-slides" "\def\DeckMode{}\input{$TEX_BASE}" || \
                echo "WARNING: XeLaTeX failed"
              xelatex -interaction=nonstopmode -halt-on-error \
                -jobname="${SLUG}-handout" "\def\HandoutMode{}\input{$TEX_BASE}" || \
                echo "WARNING: XeLaTeX failed"
              [ -f "${SLUG}-slides.pdf" ] && \
                cp "${SLUG}-slides.pdf"  "../../compiled/$SLUG/${SLUG}-slides.pdf"
              [ -f "${SLUG}-handout.pdf" ] && \
                cp "${SLUG}-handout.pdf" "../../compiled/$SLUG/${SLUG}-handout.pdf"
              cd ../..
            else
              cd "papers/$SLUG"
              latexmk -xelatex -interaction=nonstopmode -halt-on-error "$TEX_BASE" || \
                echo "WARNING: XeLaTeX failed"
              cd ../..
            fi
          fi

      - name: Compute latexdiff against previous tag
        run: |
          if [ -z "$MAIN_TEX_BASE" ] || [ "$FORMAT" = "slides" ] || [ "$FORMAT" = "dual" ]; then
            echo "Skipping latexdiff for format=${FORMAT:-unknown}"
          else
            PREV_TAG=$(git tag -l "style-*" | grep -vE '\.' | sort -t- -k2 | tail -1)
            if [ -z "$PREV_TAG" ]; then
              echo "No previous major tag — skipping latexdiff"
            else
              # Try current filename first, fall back to legacy main.tex
              PREV_CONTENT=$(git show "${PREV_TAG}:papers/$SLUG/$MAIN_TEX_BASE" 2>/dev/null || \
                             git show "${PREV_TAG}:papers/$SLUG/main.tex" 2>/dev/null || true)
              if [ -z "$PREV_CONTENT" ]; then
                echo "No previous .tex in tag $PREV_TAG — skipping latexdiff"
              else
                echo "$PREV_CONTENT" > /tmp/prev.tex
                latexdiff /tmp/prev.tex "papers/$SLUG/$MAIN_TEX_BASE" > \
                  "papers/$SLUG/diff-${PREV_TAG}-${NEXT_TAG}.tex" || \
                  echo "WARNING: latexdiff failed"
                if [ -f "papers/$SLUG/diff-${PREV_TAG}-${NEXT_TAG}.tex" ]; then
                  cp "papers/$SLUG/$MAIN_TEX_BASE" "papers/$SLUG/main-orig.tex"
                  cp "papers/$SLUG/diff-${PREV_TAG}-${NEXT_TAG}.tex" "papers/$SLUG/$MAIN_TEX_BASE"
                  cd "papers/$SLUG"
                  latexmk -xelatex -interaction=nonstopmode "$MAIN_TEX_BASE" && \
                    mv "${MAIN_TEX_BASE%.tex}.pdf" "diff-${PREV_TAG}-${NEXT_TAG}.pdf" || \
                    echo "WARNING: diff PDF compile failed"
                  mv main-orig.tex "$MAIN_TEX_BASE"
                  cd ../..
                fi
              fi
            fi
          fi

      - name: Commit promotion and apply tag
        run: |
          git config user.name  "energeia-bot"
          git config user.email "energeia@skeptou.com"
          git add "papers/$SLUG/"
          git add "compiled/$SLUG/" 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          COMMIT_MSG="energeia: promote $SLUG to $NEXT_TAG (${{ inputs.classification }}) [automated]"
          [ -n "${{ inputs.note }}" ] && COMMIT_MSG="${COMMIT_MSG}"$'\n'"${{ inputs.note }}"
          git commit -m "$COMMIT_MSG"
          TAG_MSG="${NEXT_TAG}"$'\n'"slug: $SLUG"$'\n'"source: $BRANCH"$'\n'"classification: ${{ inputs.classification }}"$'\n'"class_source: ${{ inputs.class_source }}"$'\n'"diff_pct: ${{ steps.diff.outputs.diff_pct }}%"$'\n'"note: ${{ inputs.note }}"
          git tag -a "$NEXT_TAG" -m "$TAG_MSG"
          git push origin energeia
          git push origin "$NEXT_TAG"
          echo "Tagged $NEXT_TAG and pushed"
