name: Deploy aristeia

on:
  push:
    branches: [main]
    paths:
      - 'modules/aristeia/**'
      - 'assets/branding/**'
      - 'assets/fonts/**'
      - 'assets/css/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── Step 1: Copy design assets ───────────────────────────────────────
      - name: Copy design assets
        run: |
          cp assets/branding/tokens/design-tokens.css modules/aristeia/static/design-tokens.css
          cp assets/css/skeptou.css modules/aristeia/static/skeptou.css
          mkdir -p modules/aristeia/static/fonts/borges
          cp assets/fonts/Borges-*.ttf modules/aristeia/static/fonts/borges/

      # ── Step 2: Build dist ────────────────────────────────────────────────
      - name: Build dist
        run: |
          rm -rf modules/aristeia/dist
          mkdir -p modules/aristeia/dist
          # App shell
          cp modules/aristeia/index.html modules/aristeia/dist/
          cp modules/aristeia/view.html  modules/aristeia/dist/
          # Static assets (CSS, fonts, _headers)
          cp -r modules/aristeia/static/. modules/aristeia/dist/
          # Pages Functions
          cp -r modules/aristeia/functions modules/aristeia/dist/functions
          echo "=== dist/ ==="
          find modules/aristeia/dist -not -type d | sort

      # ── Step 3: Deploy to Cloudflare Pages ───────────────────────────────
      # Run `wrangler pages deploy .` with CWD = dist/ so wrangler finds
      # ./functions/ alongside static assets and bundles them as Pages Functions.
      - name: Deploy to Cloudflare Pages
        working-directory: modules/aristeia/dist
        run: npx wrangler@3 pages deploy . --project-name aristeia --branch main --commit-dirty=true --commit-message "ci-deploy"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    # ── Secrets registry ──────────────────────────────────────────────────────
    # GitHub Actions repo secrets (Settings → Secrets → Actions):
    #   CLOUDFLARE_API_TOKEN   — Pages deploy permission        [REQUIRED]
    #   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account ID          [REQUIRED]
    #
    # Cloudflare Pages secrets (CF dashboard → aristeia → Settings → Variables):
    #   HMAC_SECRET            — 32-byte base64url HMAC key (auth-core shared secret)
    #   AUTH_DOMAIN            — "https://auth.skeptou.com"
    #
    # Cloudflare Pages bindings (CF dashboard → aristeia → Settings → Functions):
    #   D1 binding  DB            → skeptou-aristeia
    #   R2 binding  ARISTEIA_R2   → skeptou-aristeia
    #
    # DevOps setup (one-time, before first deploy):
    #   wrangler d1 create skeptou-aristeia
    #   wrangler d1 migrations apply skeptou-aristeia --remote
    #   wrangler r2 bucket create skeptou-aristeia
    #   # Add database_id to wrangler.toml, then configure dashboard bindings
