name: Deploy phero

on:
  push:
    branches: [main]
    paths:
      - 'modules/phero/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy phero.skeptou.com
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: modules/phero/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: modules/phero

      - name: Type-check
        run: npm run type-check
        working-directory: modules/phero

      # ── Step 1: Create D1 database if absent ─────────────────────────────────
      # Calls CF API to check for skeptou-phero; creates it if missing.
      # Patches database_id into wrangler.toml for the subsequent migrate + deploy steps.
      - name: Resolve D1 database
        working-directory: modules/phero
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          EXISTING=$(curl -s \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?name=skeptou-phero" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")

          DB_ID=$(echo "$EXISTING" | python3 -c \
            "import sys,json; r=json.load(sys.stdin).get('result',[]); print(r[0]['uuid'] if r else '')" \
            2>/dev/null || echo "")

          if [ -z "$DB_ID" ]; then
            echo "skeptou-phero not found -- creating..."
            CREATE=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"name":"skeptou-phero"}')
            DB_ID=$(echo "$CREATE" | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['uuid'])")
            echo "Created D1 database: $DB_ID"
          else
            echo "D1 database exists: $DB_ID"
          fi

          sed -i "s/database_id = \"FILL_AFTER_CREATE\"/database_id = \"${DB_ID}\"/" wrangler.toml
          echo "PHERO_D1_ID=${DB_ID}" >> "$GITHUB_ENV"

      # ── Step 2: Apply D1 migrations ───────────────────────────────────────────
      # Idempotent -- only unapplied migrations are run.
      - name: Apply D1 migrations
        working-directory: modules/phero
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 d1 migrations apply skeptou-phero --remote

      # ── Step 3: Provision Worker secrets ──────────────────────────────────────
      # Each secret is pushed from the corresponding GH repo secret.
      # If a GH secret is not yet set, the step emits a warning and skips it
      # (Worker will 500 until secrets are provisioned -- see Cam manual steps).
      #
      # GH secret names (Settings -> Secrets -> Actions):
      #   PHERO_AUTH_HMAC_SECRET        same value as auth-core HMAC_SECRET (skeptou env)
      #   PHERO_ENERGEIA_SERVICE_TOKEN  service token for energeia content proxy
      #   PHERO_ARISTEIA_SERVICE_TOKEN  service token for aristeia content proxy
      #   PHERO_COOKIE_SIGNING_KEY      generate: openssl rand -hex 32
      - name: Provision Worker secrets
        working-directory: modules/phero
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          _AUTH_HMAC_SECRET: ${{ secrets.PHERO_AUTH_HMAC_SECRET }}
          _ENERGEIA_SERVICE_TOKEN: ${{ secrets.PHERO_ENERGEIA_SERVICE_TOKEN }}
          _ARISTEIA_SERVICE_TOKEN: ${{ secrets.PHERO_ARISTEIA_SERVICE_TOKEN }}
          _COOKIE_SIGNING_KEY: ${{ secrets.PHERO_COOKIE_SIGNING_KEY }}
        run: |
          push_secret() {
            local wrangler_name="$1" value="$2"
            if [ -n "$value" ]; then
              echo "$value" | npx wrangler@3 secret put "$wrangler_name"
              echo "Provisioned $wrangler_name"
            else
              echo "::warning::GH secret for $wrangler_name is empty -- Worker will error until set"
            fi
          }
          push_secret AUTH_HMAC_SECRET        "$_AUTH_HMAC_SECRET"
          push_secret ENERGEIA_SERVICE_TOKEN  "$_ENERGEIA_SERVICE_TOKEN"
          push_secret ARISTEIA_SERVICE_TOKEN  "$_ARISTEIA_SERVICE_TOKEN"
          push_secret COOKIE_SIGNING_KEY      "$_COOKIE_SIGNING_KEY"

      # ── Step 4: Deploy Worker + static assets ─────────────────────────────────
      # Uses Workers + Assets model: static assets in public/ are served by
      # Cloudflare CDN; Worker handles /api/* and /<slug> dynamic routes.
      # wrangler.toml [[routes]] attaches phero.skeptou.com automatically
      # (requires zone edit permission on the CLOUDFLARE_API_TOKEN).
      - name: Deploy Worker
        working-directory: modules/phero
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@3 deploy

  # ── Secrets registry ────────────────────────────────────────────────────────
  # GitHub Actions repo secrets (Settings -> Secrets -> Actions):
  #   CLOUDFLARE_API_TOKEN          Pages/Worker deploy + zone edit  [REQUIRED -- already set]
  #   CLOUDFLARE_ACCOUNT_ID         Cloudflare account ID            [REQUIRED -- already set]
  #   PHERO_AUTH_HMAC_SECRET        auth-core HMAC_SECRET (skeptou)  [Cam manual step #1]
  #   PHERO_ENERGEIA_SERVICE_TOKEN  energeia service token            [Cam manual step #2]
  #   PHERO_ARISTEIA_SERVICE_TOKEN  aristeia service token            [Cam manual step #3]
  #   PHERO_COOKIE_SIGNING_KEY      openssl rand -hex 32             [Cam manual step #4]
  #
  # CF Access (dashboard only -- no API automation):
  #   Apply Access policy to phero.skeptou.com/manage/* + /api/shares*  [Cam manual step #5]
