name: Deploy phronesis

on:
  push:
    branches: [main]
    paths:
      - 'modules/phronesis/**'
      - 'assets/branding/**'
      - 'assets/fonts/**'
      - 'assets/css/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: modules/phronesis/package-lock.json

      - name: Install dependencies
        run: cd modules/phronesis && npm ci

      # ── Step 1: Sync vault content ─────────────────────────────────────
      # iCloud .ics vault path:  calendar/icloud-export.ics
      # Local dest:              modules/phronesis/content/calendar.ics
      # Canonical plan dir:      projects/  (O&P vault)
      # Exits 0 gracefully when VAULT_GITHUB_PAT / VAULT_REPO are not set.
      - name: Sync vault content
        env:
          VAULT_GITHUB_PAT: ${{ secrets.VAULT_GITHUB_PAT }}
          VAULT_REPO: ${{ secrets.VAULT_REPO }}
          VAULT_SUBTREE: ${{ secrets.VAULT_SUBTREE }}
        run: node modules/phronesis/scripts/sync-vault.js

      # ── Step 2: Aggregate busy-period data ─────────────────────────────
      # Pulls commitments / dated tasks / dated projects from D1 (remote),
      # then merges any optional content/calendar-sync.md and falls back to
      # content/commitments.md if D1 yielded nothing. Skips D1 silently when
      # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are absent (local dev).
      - name: Aggregate busy-period data
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node modules/phronesis/scripts/aggregate-busy.js

      # ── Step 3: Generate visualizations ────────────────────────────────
      - name: Generate visualizations
        run: node modules/phronesis/scripts/generate-viz.js

      # ── Step 4: Copy design tokens, CSS, and fonts ─────────────────────
      # design-tokens.css → modules/phronesis/static/
      # skeptou.css       → modules/phronesis/static/
      # Borges *.ttf      → modules/phronesis/static/fonts/borges/
      - name: Copy design assets
        run: |
          cp assets/branding/tokens/design-tokens.css modules/phronesis/static/design-tokens.css
          cp assets/css/skeptou.css modules/phronesis/static/skeptou.css
          mkdir -p modules/phronesis/static/fonts/borges
          cp assets/fonts/Borges-*.ttf modules/phronesis/static/fonts/borges/

      # ── Step 5: Generate PWA icons ──────────────────────────────────────
      - name: Generate PWA icons
        run: node modules/phronesis/scripts/generate-icons.js || echo "Icon generation skipped — placeholder icons remain"

      # ── Step 6: Build static output (baseline) ──────────────────────────
      # Quartz integration is deferred: Quartz needs to be installed separately
      # via `npx quartz create` and added to package.json dependencies.
      # Until then, this step manually flattens static/ → dist/ to produce a
      # deployable Cloudflare Pages artifact that matches the Quartz output
      # structure (static/ contents served at root).
      #
      # Pages Functions (Worker endpoints) are included at dist/functions/ so
      # Cloudflare Pages Direct Upload discovers them in the upload.
      #
      # When Quartz is ready: remove this step, uncomment "Build Quartz" below,
      # and update directory: to modules/phronesis/public.
      - name: Build static output (baseline — no Quartz)
        run: |
          rm -rf modules/phronesis/dist
          mkdir -p modules/phronesis/dist
          # index.html at root
          cp modules/phronesis/index.html modules/phronesis/dist/
          # Flatten static/ → dist/ (design-tokens.css, skeptou.css, manifest.json,
          # fonts/, icons/ — all served from / in Cloudflare Pages)
          cp -r modules/phronesis/static/. modules/phronesis/dist/
          # Pages Functions in upload (Cloudflare Pages Direct Upload reads functions/
          # from the upload directory)
          cp -r modules/phronesis/functions modules/phronesis/dist/functions
          # Deploy data JSON files produced by sync-vault.js + aggregate-busy.js
          # Copy top-level *.json and any subdirectories (e.g. projects/<slug>.json)
          mkdir -p modules/phronesis/dist/data
          cp modules/phronesis/src/data/*.json modules/phronesis/dist/data/ 2>/dev/null || true
          if [ -d modules/phronesis/src/data/projects ]; then
            cp -r modules/phronesis/src/data/projects modules/phronesis/dist/data/
          fi
          # Stamp SW cache name with commit SHA so every deploy busts the previous cache.
          # Replaces CACHE_NAME in dist/sw.js only (source sw.js is unchanged in repo).
          SHORT_SHA=$(git rev-parse --short HEAD)
          sed -i "s/const CACHE_NAME = 'phronesis-[^']*'/const CACHE_NAME = 'phronesis-${SHORT_SHA}'/" modules/phronesis/dist/sw.js
          echo "SW cache stamped: phronesis-${SHORT_SHA}"
          echo "dist/ contents:"
          find modules/phronesis/dist -not -type d | sort

      # ── Step 6b: Build Quartz (enable when Quartz is installed) ─────────
      # Prereq: run `npx quartz create` in modules/phronesis/ and commit the
      # resulting quartz.json + updated package.json (with @jackyzha0/quartz dep).
      # Then: remove "Build static output" step above, uncomment this step,
      # and change directory: below to modules/phronesis/public.
      #
      # - name: Build Quartz
      #   run: cd modules/phronesis && npx quartz build

      # ── Step 7: Deploy to Cloudflare Pages ───────────────────────────────
      # Requires: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets.
      # Provision via: GitHub repo → Settings → Secrets and variables → Actions.
      #
      # NOTE: cloudflare/pages-action@v1 is intentionally NOT used here.
      # The action hard-codes `wrangler pages publish` regardless of wranglerVersion,
      # and `pages publish` does not bundle a functions/ directory inside the upload
      # directory — the JS files end up as static assets instead of Pages Functions,
      # causing POST /api/* to return 405 from the static file server.
      #
      # Running `wrangler pages deploy .` with working-directory: dist/ means
      # wrangler's CWD is dist/, so it finds ./functions/ right there and bundles
      # the three ES-module handlers as Pages Functions before uploading.
      - name: Deploy to Cloudflare Pages
        working-directory: modules/phronesis/dist
        run: npx wrangler@3 pages deploy . --project-name phronesis --branch main --commit-dirty=true --commit-message "ci-deploy"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    # ── Secrets registry ────────────────────────────────────────────────────
    # GitHub Actions repo secrets (Settings → Secrets → Actions):
    #   CLOUDFLARE_API_TOKEN   — Pages deploy permission        [REQUIRED for deploy]
    #   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account ID          [REQUIRED for deploy]
    #   VAULT_GITHUB_PAT       — O&P vault PAT, contents:read   [needed for vault sync]
    #   VAULT_REPO             — "owner/repo" for O&P vault     [needed for vault sync]
    #   VAULT_SUBTREE          — path prefix in vault repo       [needed for vault sync]
    #                            e.g. "Organization & Planning"
    #
    # Cloudflare Pages secrets (CF dashboard → phronesis → Settings → Variables):
    #   VAULT_GITHUB_PAT       — same PAT, contents:write (Worker accept/reject)
    #   VAULT_REPO             — same "owner/repo"
    #   VAULT_SUBTREE          — same path prefix
    #   CF_ACCESS_AUD          — Access audience tag (Worker JWT validation)
