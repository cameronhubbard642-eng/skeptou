name: Deploy strategia

on:
  push:
    branches: [main]
    paths:
      - 'modules/strategia/**'
      - 'assets/branding/**'
      - 'assets/fonts/**'
      - 'assets/css/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── Step 1: Copy design tokens, CSS, and fonts ──────────────────────
      # assets/branding/tokens/design-tokens.css  → modules/strategia/public/
      # assets/css/skeptou.css                    → modules/strategia/public/
      # assets/fonts/Borges-*.ttf                 → modules/strategia/public/fonts/borges/
      - name: Copy design assets
        run: |
          cp assets/branding/tokens/design-tokens.css modules/strategia/static/design-tokens.css
          cp assets/css/skeptou.css modules/strategia/static/skeptou.css
          mkdir -p modules/strategia/static/fonts/borges
          cp assets/fonts/Borges-*.ttf modules/strategia/static/fonts/borges/

      # ── Step 2: Build dist/ ─────────────────────────────────────────────
      # Flatten public/ → dist/, include functions/ for Pages Functions.
      - name: Build dist
        run: |
          rm -rf modules/strategia/dist
          mkdir -p modules/strategia/dist
          cp -r modules/strategia/static/. modules/strategia/dist/
          cp -r modules/strategia/functions modules/strategia/dist/functions
          echo "dist/ contents:"
          find modules/strategia/dist -not -type d | sort

      # ── Step 3: Deploy to Cloudflare Pages ─────────────────────────────
      # Pages project name: strategia
      # Bindings (set in CF dashboard → strategia → Settings → Functions):
      #   DB            — D1: skeptou-strategia
      #   OP_DB         — D1: skeptou-op  (shared service_tokens, S-4)
      #   STRATEGIA_R2  — R2: skeptou-strategia
      # Secrets (CF dashboard → strategia → Settings → Variables):
      #   HMAC_SECRET   — session cookie signing key (same as phronesis)
      - name: Deploy to Cloudflare Pages
        working-directory: modules/strategia/dist
        run: npx wrangler@3 pages deploy . --project-name strategia --branch main --commit-dirty=true --commit-message "ci-deploy"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    # ── Secrets registry ────────────────────────────────────────────────────
    # GitHub Actions repo secrets (Settings → Secrets → Actions):
    #   CLOUDFLARE_API_TOKEN   — Pages deploy permission        [REQUIRED]
    #   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account ID          [REQUIRED]
    #
    # Cloudflare Pages secrets (CF dashboard → strategia → Settings → Variables):
    #   HMAC_SECRET   — same 32-byte base64url key as phronesis
    #   AUTH_DOMAIN   — https://auth.skeptou.com (optional, default used if absent)
